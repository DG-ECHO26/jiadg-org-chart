<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jesus Is Alive DG – Dubai · Organisational Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#0B1B2E; --navy-2:#102842; --navy-3:#16324F;
    --gold:#E3C066; --gold-2:#C9A227; --gold-dim:rgba(227,192,102,.16);
    --emerald:#4FBF87; --emerald-dim:rgba(79,191,135,.14);
    --ink:#EAF1F9; --soft:#C3D2E3; --muted:#8DA2BA;
    --glass:rgba(255,255,255,.045);
    --glass-2:rgba(255,255,255,.075);
    --edge:rgba(255,255,255,.10);
    --edge-2:rgba(255,255,255,.16);
    --shadow-sm:0 1px 0 rgba(255,255,255,.05) inset, 0 10px 26px rgba(0,0,0,.30);
    --shadow-md:0 1px 0 rgba(255,255,255,.06) inset, 0 22px 48px rgba(0,0,0,.42);
    --r-lg:22px; --r-md:16px;
    --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
    --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--navy);
    color:var(--ink);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ---- Ambient field ---- */
  .ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% -20%, #1B3A5E 0%, rgba(27,58,94,0) 60%),
      radial-gradient(90% 70% at 100% 110%, #0F2C4A 0%, rgba(15,44,74,0) 62%),
      linear-gradient(180deg,#0B1B2E 0%,#0A1728 55%,#081422 100%);
  }
  .ambient .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5}
  .ambient .o1{width:52vw;height:52vw;left:-12vw;top:-14vw;background:radial-gradient(circle,rgba(201,162,39,.34),rgba(201,162,39,0) 68%);animation:drift1 26s ease-in-out infinite alternate}
  .ambient .o2{width:46vw;height:46vw;right:-10vw;top:22vh;background:radial-gradient(circle,rgba(46,139,87,.30),rgba(46,139,87,0) 68%);animation:drift2 32s ease-in-out infinite alternate}
  .ambient .o3{width:60vw;height:60vw;left:24vw;bottom:-28vw;background:radial-gradient(circle,rgba(63,124,196,.30),rgba(63,124,196,0) 70%);animation:drift3 38s ease-in-out infinite alternate}
  .ambient .grain{position:absolute;inset:0;opacity:.28;
    background-image:radial-gradient(rgba(255,255,255,.16) .5px, transparent .5px);
    background-size:3px 3px;mix-blend-mode:overlay}
  .ambient .vignette{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 40%, rgba(0,0,0,0) 42%, rgba(0,0,0,.42) 100%)}
  @keyframes drift1{to{transform:translate3d(7vw,6vh,0) scale(1.12)}}
  @keyframes drift2{to{transform:translate3d(-6vw,-7vh,0) scale(1.1)}}
  @keyframes drift3{to{transform:translate3d(4vw,-5vh,0) scale(1.08)}}

  .deck{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}

  /* ---- Top bar ---- */
  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px clamp(14px,3vw,48px);
    border-bottom:1px solid var(--edge);background:rgba(8,20,34,.55);backdrop-filter:blur(14px) saturate(1.3)}
  .mark{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
  .mark img{width:34px;height:34px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 10px rgba(227,192,102,.45))}
  .mark .name{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mark .name span{color:var(--gold)}
  .bar-tools{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .tool{border:1px solid var(--edge-2);background:var(--glass);color:var(--soft);font-family:var(--body);
    font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:8px 13px;border-radius:10px;
    cursor:pointer;transition:background .18s,color .18s,border-color .18s;white-space:nowrap;backdrop-filter:blur(8px)}
  .tool:hover{background:var(--glass-2);color:#fff;border-color:rgba(227,192,102,.5)}
  .tool.is-on{background:var(--gold);color:#10243C;border-color:var(--gold)}
  .tool.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .tool.ghost:hover{color:var(--ink);background:var(--glass)}
  .counter{display:flex;align-items:baseline;gap:6px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap}
  .counter b{font-size:14px;color:var(--gold);font-weight:700;letter-spacing:.04em}

  /* ---- Stage ---- */
  .stage{flex:1 1 auto;position:relative;overflow:hidden}
  .slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
    padding:clamp(18px,3vh,40px) clamp(16px,3.2vw,60px) clamp(74px,9vh,94px);
    opacity:0;visibility:hidden;transform:translateY(16px);
    transition:opacity .5s ease,transform .5s ease,visibility .5s;
    display:flex;flex-direction:column;justify-content:center}
  .slide.is-active{opacity:1;visibility:visible;transform:none}
  .slide::-webkit-scrollbar{width:8px}
  .slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:99px}
  .inner{width:100%;max-width:1180px;margin:0 auto}

  /* ---- Type ---- */
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--gold);margin:0 0 10px}
  .eyebrow::before{content:"";width:22px;height:1.5px;background:linear-gradient(90deg,rgba(227,192,102,0),var(--gold));border-radius:2px}
  h2.title{font-family:var(--display);font-size:clamp(28px,4.4vw,50px);line-height:1.06;letter-spacing:-.012em;font-weight:600;
    color:#fff;margin:0 0 6px;text-shadow:0 2px 30px rgba(0,0,0,.35)}
  .subtitle{font-size:clamp(12px,1.3vw,15px);color:var(--muted);margin:0;font-weight:400}
  .head{margin-bottom:clamp(16px,2.6vh,30px)}

  /* ---- Anniversary badge ---- */
  .badge{display:inline-flex;align-items:center;gap:9px;
    background:linear-gradient(100deg,rgba(227,192,102,.16),rgba(227,192,102,.05));
    border:1px solid rgba(227,192,102,.42);color:var(--gold);border-radius:99px;padding:7px 16px 7px 12px;
    font-size:clamp(10.5px,1.15vw,12.5px);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    box-shadow:0 0 28px rgba(227,192,102,.14);margin-bottom:16px}
  .badge svg{width:15px;height:15px;color:var(--gold);flex:0 0 auto}

  /* ---- Cover ---- */
  .cover{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(22px,4vw,60px);align-items:center}
  .cover h1{font-family:var(--display);font-size:clamp(32px,5vw,60px);line-height:1.02;letter-spacing:-.018em;font-weight:700;
    color:#fff;margin:0;text-shadow:0 4px 40px rgba(0,0,0,.4)}
  .cover .city{display:block;font-family:var(--body);font-size:.34em;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--gold);margin-top:12px}
  .rule{width:74px;height:2px;background:linear-gradient(90deg,var(--gold),rgba(227,192,102,0));border-radius:3px;margin:18px 0 20px}
  .creed{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:8px}
  .creed li{display:flex;align-items:center;gap:11px;font-size:clamp(12.5px,1.45vw,16.5px);color:var(--soft);font-weight:500}
  .creed li::before{content:"";width:6px;height:6px;flex:0 0 auto;border-radius:50%;background:var(--emerald);box-shadow:0 0 12px rgba(79,191,135,.8)}
  .verse-block{border-left:2px solid rgba(227,192,102,.6);padding:4px 0 4px 18px}
  .verse-block p{margin:0;font-family:var(--display);font-size:clamp(15px,1.9vw,22px);line-height:1.34;color:#F3F7FC;font-weight:500;font-style:italic}
  .verse-block cite{display:block;margin-top:8px;font-family:var(--body);font-style:normal;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .cover-art{display:grid;place-items:center;position:relative}
  .cover-art .halo{position:absolute;width:min(100%,430px);aspect-ratio:1;border-radius:50%;
    border:1px solid rgba(227,192,102,.16);
    box-shadow:0 0 90px rgba(227,192,102,.10) inset}
  .cover-art .halo.two{width:min(80%,344px);border-color:rgba(255,255,255,.07)}
  .cover-art img{position:relative;width:min(76%,312px);height:auto;filter:drop-shadow(0 0 60px rgba(227,192,102,.42))}

  /* ---- Glass cards ---- */
  .card{position:relative;background:var(--glass);border:1px solid var(--edge);border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm);padding:clamp(13px,1.6vw,21px);backdrop-filter:blur(16px) saturate(1.2)}
  .card-title{font-family:var(--display);font-size:clamp(18px,2vw,25px);font-weight:600;color:#fff;margin:0;line-height:1.15}
  .card-sub{font-size:11.5px;color:var(--muted);margin:4px 0 0}
  .card-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:0 0 8px}

  .grid{display:grid;gap:clamp(10px,1.3vw,17px)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}

  /* ---- Name chips ---- */
  .names{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:clamp(11.5px,1.1vw,13.5px);font-weight:500;
    color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--edge);padding:6px 12px;border-radius:99px;max-width:100%}
  .chip .x{display:none}
  .icon{width:clamp(32px,3.4vw,42px);height:clamp(32px,3.4vw,42px);border-radius:13px;display:grid;place-items:center;flex:0 0 auto;
    background:rgba(255,255,255,.06);border:1px solid var(--edge);color:var(--soft)}
  .icon svg{width:52%;height:52%}
  .icon.i-gold{background:var(--gold-dim);border-color:rgba(227,192,102,.34);color:var(--gold);box-shadow:0 0 22px rgba(227,192,102,.12)}
  .icon.i-emerald{background:var(--emerald-dim);border-color:rgba(79,191,135,.32);color:var(--emerald);box-shadow:0 0 22px rgba(79,191,135,.12)}

  /* ---- Editing ---- */
  .ed{outline:none;border-radius:5px;min-width:14px;display:inline-block}
  body.editing .ed{box-shadow:inset 0 -1px 0 rgba(255,255,255,.22);cursor:text}
  body.editing .ed:hover{box-shadow:inset 0 -1px 0 var(--gold)}
  .ed:focus{background:rgba(227,192,102,.15);box-shadow:0 0 0 2px var(--gold) !important;color:#fff}
  .chip .x{width:16px;height:16px;border:none;border-radius:50%;background:rgba(255,255,255,.16);color:#DCE6F1;font-size:11px;line-height:1;cursor:pointer;padding:0;place-items:center;flex:0 0 auto}
  .chip .x:hover{background:#D2543F;color:#fff}
  body.editing .chip .x{display:grid}
  .add{display:none;align-items:center;gap:6px;border:1px dashed rgba(255,255,255,.26);background:transparent;color:var(--soft);
    font-family:var(--body);font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:99px;cursor:pointer}
  .add:hover{border-color:var(--gold);color:var(--gold);background:rgba(227,192,102,.08)}
  body.editing .add{display:inline-flex}
  .card-del{display:none;position:absolute;top:9px;right:9px;width:22px;height:22px;border:1px solid var(--edge-2);
    background:rgba(10,23,40,.8);color:#CBD8E6;border-radius:50%;font-size:12px;line-height:1;cursor:pointer;place-items:center;z-index:2}
  .card-del:hover{background:#D2543F;color:#fff;border-color:#D2543F}
  body.editing .card-del{display:grid}
  .add-card{display:none;align-items:center;justify-content:center;gap:8px;min-height:96px;border:1.5px dashed rgba(255,255,255,.22);
    border-radius:var(--r-lg);background:rgba(255,255,255,.02);color:var(--soft);font-family:var(--body);font-size:12px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .add-card:hover{border-color:var(--gold);color:var(--gold)}
  body.editing .add-card{display:flex}
  .edit-hint{display:none;margin:0 0 14px;font-size:11.5px;color:var(--soft);background:rgba(227,192,102,.08);
    border:1px solid rgba(227,192,102,.3);border-radius:10px;padding:9px 13px}
  body.editing .edit-hint{display:block}

  /* ---- Hierarchy ---- */
  .chain{display:grid;justify-items:center}
  .tier{width:100%;max-width:900px}
  .tier-card{position:relative;background:var(--glass);border:1px solid var(--edge);border-radius:var(--r-lg);
    box-shadow:var(--shadow-md);padding:clamp(13px,1.7vw,22px) clamp(15px,2vw,28px);
    display:grid;grid-template-columns:auto 1fr;gap:clamp(12px,2vw,26px);align-items:center;overflow:hidden;
    backdrop-filter:blur(16px) saturate(1.2)}
  .tier-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#5C8BC4;box-shadow:0 0 20px rgba(92,139,196,.7)}
  .tier-card.t-gold::before{background:var(--gold);box-shadow:0 0 22px rgba(227,192,102,.75)}
  .tier-card.t-emerald::before{background:var(--emerald);box-shadow:0 0 22px rgba(79,191,135,.65)}
  .tier-meta{min-width:clamp(118px,15vw,190px)}
  .tier-rank{font-family:var(--display);font-size:clamp(15px,1.7vw,20px);font-weight:700;color:#fff;margin:0;line-height:1.15}
  .tier-tag{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:5px 0 0}
  .connector{display:grid;justify-items:center;padding:8px 0}
  .connector .line{width:1.5px;height:clamp(12px,2.2vh,24px);background:linear-gradient(rgba(255,255,255,.06),rgba(227,192,102,.8))}
  .connector .node{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(227,192,102,.14),0 0 18px rgba(227,192,102,.8);margin:4px 0}
  .connector .line.tail{background:linear-gradient(rgba(227,192,102,.8),rgba(255,255,255,.06))}

  /* ---- Ministry cards ---- */
  .ministry{display:flex;flex-direction:column;gap:10px;transition:transform .25s,box-shadow .25s,border-color .25s}
  .ministry:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:rgba(227,192,102,.32)}
  .ministry .m-name{font-size:clamp(14.5px,1.5vw,18px);font-weight:600;color:#fff;margin:0;line-height:1.2;letter-spacing:-.005em}
  .ministry .abbr{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:3px 0 0}
  .headline{margin-top:auto;padding-top:10px;border-top:1px solid var(--edge)}
  .headline .role{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 3px}
  .headline .person{font-size:clamp(12.5px,1.35vw,15px);font-weight:600;color:#F1F6FB;margin:0}

  /* ---- Assistants ---- */
  .assist{display:grid;grid-template-columns:auto 1fr;gap:clamp(13px,2vw,22px);align-items:start}
  .avatar{width:clamp(44px,4.4vw,56px);height:clamp(44px,4.4vw,56px);border-radius:18px;display:grid;place-items:center;
    background:linear-gradient(150deg,#22456E,#14304F);color:#fff;border:1px solid var(--edge-2);
    font-family:var(--display);font-size:clamp(16px,1.8vw,21px);font-weight:700;box-shadow:0 10px 26px rgba(0,0,0,.4)}
  .avatar.a-gold{background:linear-gradient(150deg,#E3C066,#B8901F);color:#10243C;border-color:rgba(255,255,255,.28);box-shadow:0 10px 30px rgba(227,192,102,.24)}
  .duties{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;justify-items:start}
  .duties li{display:flex;align-items:center;gap:9px;font-size:clamp(12px,1.3vw,14.5px);font-weight:500;color:var(--soft)}
  .duties li .dot{width:6px;height:6px;border-radius:50%;background:var(--emerald);box-shadow:0 0 10px rgba(79,191,135,.8);flex:0 0 auto}
  .duties .x{width:16px;height:16px;border:none;border-radius:50%;background:rgba(255,255,255,.16);color:#DCE6F1;font-size:11px;line-height:1;cursor:pointer;padding:0;display:none;place-items:center}
  body.editing .duties .x{display:grid}
  .duties .x:hover{background:#D2543F;color:#fff}

  /* ---- Departments ---- */
  .dept-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .dept-head .icon{width:30px;height:30px;border-radius:10px}
  .dept-head h4{margin:0;font-size:clamp(12.5px,1.3vw,14.5px);font-weight:600;color:#fff}
  .dept-head .count{margin-left:auto;font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.1em}
  .role-block + .role-block{margin-top:11px;padding-top:11px;border-top:1px solid var(--edge)}
  .role-block h5{margin:0 0 7px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .role-block .lead{margin:0;font-size:clamp(13px,1.4vw,15px);font-weight:600;color:#F1F6FB}

  /* ---- Flow ---- */
  .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.3vw,16px)}
  .step{position:relative;background:var(--glass);border:1px solid var(--edge);border-radius:var(--r-md);
    box-shadow:var(--shadow-sm);padding:clamp(12px,1.4vw,17px);display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(14px)}
  .step .num{font-size:9.5px;letter-spacing:.18em;font-weight:700;color:var(--gold)}
  .step h4{margin:0;font-size:clamp(12.5px,1.3vw,14.5px);font-weight:600;color:#fff;line-height:1.25}
  .step p{margin:0;font-size:11.5px;line-height:1.45;color:var(--muted)}
  .step .icon{width:32px;height:32px;border-radius:10px}
  .step .chev{position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:rgba(227,192,102,.55);width:10px;height:10px}
  .step:nth-child(4n) .chev{display:none}

  /* ---- Closing ---- */
  .closing{text-align:center;display:grid;justify-items:center}
  .closing img.seal{width:min(124px,26vw);height:auto;margin-bottom:16px;filter:drop-shadow(0 0 48px rgba(227,192,102,.45))}
  .closing blockquote{margin:0;max-width:900px;font-family:var(--display);font-size:clamp(20px,3.2vw,40px);line-height:1.28;color:#fff;font-weight:500;text-shadow:0 4px 40px rgba(0,0,0,.4)}
  .closing .ref{margin:20px 0 0;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .closing .divider{width:120px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(227,192,102,.6),rgba(255,255,255,0));margin:26px 0 18px}
  .closing .footer-name{font-size:clamp(12px,1.4vw,15px);font-weight:600;color:#EAF1F9;letter-spacing:.06em;margin:0}
  .closing .footer-sub{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;font-weight:500}

  /* ---- Controls ---- */
  .controls{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:10px clamp(14px,3vw,48px);background:linear-gradient(to top,rgba(8,20,34,.92) 55%,rgba(8,20,34,0))}
  .dots{display:flex;gap:7px;flex-wrap:wrap}
  .dot{width:9px;height:9px;padding:0;border:none;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer;transition:background .2s,width .25s}
  .dot:hover{background:rgba(255,255,255,.4)}
  .dot.is-active{background:var(--gold);width:24px;border-radius:99px;box-shadow:0 0 14px rgba(227,192,102,.7)}
  .arrows{display:flex;gap:8px}
  .btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--edge-2);background:var(--glass);color:var(--soft);cursor:pointer;
    display:grid;place-items:center;backdrop-filter:blur(10px);transition:background .18s,color .18s,border-color .18s}
  .btn:hover:not(:disabled){background:var(--gold);color:#10243C;border-color:var(--gold)}
  .btn:disabled{opacity:.3;cursor:default}
  .btn svg{width:16px;height:16px}
  .btn:focus-visible,.dot:focus-visible,.tool:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .slide-name{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;display:none}
  @media (min-width:900px){.slide-name{display:block}}

  .toast{position:fixed;left:50%;bottom:74px;transform:translate(-50%,12px);background:rgba(227,192,102,.95);color:#10243C;
    font-size:12px;font-weight:600;padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;z-index:40}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---- Responsive ---- */
  @media (max-width:1024px){
    .g4{grid-template-columns:repeat(2,1fr)}
    .flow{grid-template-columns:repeat(2,1fr)}
    .step .chev{display:none}
  }
  @media (max-width:820px){
    .cover{grid-template-columns:1fr;gap:18px}
    .cover-art{order:-1}
    .cover-art img{width:min(48%,190px)}
    .cover-art .halo{display:none}
    .g3,.g2{grid-template-columns:1fr}
    .tier-card{grid-template-columns:1fr;gap:11px}
    .slide{justify-content:flex-start;padding-top:20px}
    .mark .name{display:none}
  }
  @media (max-width:560px){
    .g4{grid-template-columns:1fr}
    .flow{grid-template-columns:1fr}
    .counter{display:none}
    .tool{padding:8px 10px;font-size:10px}
  }
  @media (prefers-reduced-motion:reduce){
    .slide{transition:none}
    .ministry:hover{transform:none}
    .ambient .orb{animation:none}
  }

  /* ---- Sign-in modal ---- */
  .auth-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(5,14,26,.72);backdrop-filter:blur(6px)}
  .auth-wrap[hidden]{display:none}
  .auth-box{width:min(360px,90vw);background:#102338;border:1px solid var(--edge-2);border-radius:18px;padding:26px;box-shadow:0 30px 70px rgba(0,0,0,.55)}
  .auth-box h3{margin:0 0 6px;font-family:var(--display);font-size:24px;color:#fff;font-weight:600}
  .auth-box p{margin:0 0 18px;font-size:12px;color:var(--muted);line-height:1.5}
  .auth-box label{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:12px}
  .auth-box input{display:block;width:100%;margin-top:7px;padding:11px 13px;border-radius:10px;border:1px solid var(--edge-2);
    background:rgba(255,255,255,.06);color:#fff;font-family:var(--body);font-size:14px;letter-spacing:0;text-transform:none}
  .auth-box input:focus{outline:none;border-color:var(--gold)}
  .auth-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
  .auth-err{color:#FF9C8A;font-size:12px;margin:12px 0 0;min-height:16px}

  /* ---- Print: ink-friendly light version ---- */
  @media print{
    @page{size:landscape;margin:12mm}
    html,body{overflow:visible !important;height:auto !important;background:#fff !important;color:#132234 !important}
    .ambient,.controls,.topbar,.toast,.add,.add-card,.card-del,.edit-hint,.chip .x,.duties .x,.step .chev{display:none !important}
    .deck{position:static !important}
    .stage{overflow:visible !important}
    .slide{position:static !important;opacity:1 !important;visibility:visible !important;transform:none !important;
      page-break-after:always;break-after:page;min-height:auto;padding:0 0 14mm !important;display:block !important}
    .slide:last-child{page-break-after:auto}
    .inner{max-width:100% !important}
    h2.title,.cover h1,.card-title,.tier-rank,.dept-head h4,.step h4,.ministry .m-name,.closing blockquote,.headline .person,.role-block .lead{color:#1E3A5F !important;text-shadow:none !important}
    .subtitle,.tier-tag,.abbr,.step p,.card-sub,.closing .footer-sub{color:#5A6B7E !important}
    .creed li,.duties li,.chip,.verse-block p,.closing .footer-name{color:#132234 !important}
    .eyebrow,.card-label,.headline .role,.role-block h5,.closing .ref,.dept-head .count,.step .num{color:#A6841A !important}
    .card,.tier-card,.step{background:#fff !important;border:1px solid #D9E0E9 !important;box-shadow:none !important;
      backdrop-filter:none !important;break-inside:avoid}
    .chip{background:#F7F9FC !important;border-color:#E1E7EF !important}
    .icon{background:#F7F9FC !important;border-color:#E1E7EF !important;color:#1E3A5F !important;box-shadow:none !important}
    .icon.i-gold{background:#FBF6E6 !important;border-color:#EEDFB4 !important;color:#A6841A !important}
    .icon.i-emerald{background:#E8F4ED !important;border-color:#CBE6D8 !important;color:#216B42 !important}
    .avatar{background:#1E3A5F !important;color:#fff !important;box-shadow:none !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .avatar.a-gold{background:#C9A227 !important;color:#fff !important}
    .badge{background:#FBF6E6 !important;border-color:#EEDFB4 !important;color:#8C6F14 !important;box-shadow:none !important}
    .connector .node{background:#C9A227 !important;box-shadow:none !important}
    .connector .line,.connector .line.tail{background:#D9E0E9 !important}
    .tier-card::before{box-shadow:none !important}
    .headline,.role-block + .role-block{border-color:#E1E7EF !important}
    .closing img.seal,.cover-art img{filter:none !important}
    .cover{grid-template-columns:1.1fr .9fr !important}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }

  </style>

      {icon:"ic-prayer", tone:"i-emerald", title:"Prayer Team",
       people:["Sis. Liza","Sis. Sydelle","Ptra. Sarah","Ptr. Daniel","Sis. Lyn","Bro. Joe"]},
      {icon:"ic-speaker", tone:"", title:"Logistics / Sound",
       people:["Bro. Peter","Bro. Jayson","Ptr. Daniel","Bro. Joe","Bro. Jimmy","Bro. Kim","Bro. Nicco","Bro. Ninio"]}
    ],
    admin:[
      {icon:"ic-admin", tone:"i-emerald", title:"Administration", head:"Sis. Anna",
       people:["Sis. Aby","Sis. Che","Sis. Justin"]},
      {icon:"ic-media", tone:"", title:"Media", head:"Bro. Peter",
       people:["Sis. Eve","Sis. Septie","Sis. Cha","Sis. Kamisha","Sis. Hannah"]},
      {icon:"ic-finance", tone:"i-gold", title:"Finance", head:"Sis. Lyn",
       people:["Sis. Loryn","Bro. Jimmy"]}
    ],
    flow:[
      {icon:"ic-crown", tone:"i-gold", title:"Board of Elders", desc:"Spiritual covering and doctrinal oversight."},
      {icon:"ic-shepherd", tone:"", title:"Senior Pastors", desc:"Vision, teaching, and pastoral care."},
      {icon:"ic-people", tone:"i-emerald", title:"Core Leaders", desc:"Oversight of ministries and leaders."},
      {icon:"ic-hands", tone:"i-emerald", title:"Assistant Core Leaders", desc:"Support and coordination across teams."},
      {icon:"ic-star", tone:"i-gold", title:"Ministry Heads", desc:"Direction and standards for each ministry."},
      {icon:"ic-check", tone:"", title:"Assistant Ministry Heads", desc:"Execution and follow-through on assignments."},
      {icon:"ic-admin", tone:"i-emerald", title:"Department Leaders", desc:"Scheduling, training, and team readiness."},
      {icon:"ic-heart", tone:"i-gold", title:"Workers", desc:"Faithful service that carries the ministry."}
    ],
    closing:{
      quote:"Each of you should use whatever gift you have received to serve others, as faithful stewards of God's grace.",
      ref:"1 Peter 4:10",
      footer:"Jesus Is Alive Community DG — Dubai",
      sub:"Serving with Excellence · Leading with Humility"
    }
  };

  var D = clone(DEFAULTS);
  var editing = false, idx = 0;

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  /* ---------- storage ---------- */
  var sb = null, session = null, saveTimer = null;
  try{
    if (window.supabase && SUPABASE_URL.indexOf("http") === 0)
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }catch(e){}

  function save(){
    if (!sb || !session) return;                 // viewers never write
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      sb.from("org_doc").upsert({ id: KEY, data: D, updated_at: new Date().toISOString() })
        .then(function(r){ if (r.error) toast("Could not save: " + r.error.message); });
    }, 700);
  }

  function load(cb){
    if (!sb){ cb(); return; }
    sb.from("org_doc").select("data").eq("id", KEY).maybeSingle()
      .then(function(r){
        if (r && r.data && r.data.data) D = r.data.data;
        cb();
      })
      .catch(function(){ cb(); });
  }

  function merge(base, saved){ return saved && typeof saved === "object" ? saved : base; }

  /* ---------- path helpers ---------- */
  function ref(p){
    var k = p.split("/"), o = D;
    for (var i = 0; i < k.length - 1; i++) o = o[k[i]];
    return { o:o, k:k[k.length-1] };
  }
  function getVal(p){ var r = ref(p); return r.o[r.k]; }
  function setVal(p, v){ var r = ref(p); r.o[r.k] = v; save(); }
  function delAt(p){ var r = ref(p); if (Array.isArray(r.o)) r.o.splice(+r.k, 1); else delete r.o[r.k]; save(); }

  function newItem(kind){
    if (kind === "name") return "New name";
    if (kind === "ministry") return {icon:"ic-star", tone:"", name:"New Ministry", abbr:"Department", head:"To be assigned"};
    if (kind === "tier") return {rank:"New Level", tag:"Description", accent:"", people:["New name"]};
    if (kind === "group") return {icon:"ic-star", tone:"", title:"New Department", people:["New name"]};
    if (kind === "adminGroup") return {icon:"ic-admin", tone:"", title:"New Ministry", head:"Head name", people:["New name"]};
    if (kind === "assistant") return {initials:"AB", tone:"", name:"New Name", sub:"Assistant", duties:["New assignment"]};
    if (kind === "step") return {icon:"ic-star", tone:"", title:"New Level", desc:"Description of this level."};
    return "New item";
  }

  /* ---------- html fragments ---------- */
  function ed(path, cls){
    return '<span class="ed'+(cls?" "+cls:"")+'" data-p="'+path+'">'+esc(getVal(path))+'</span>';
  }
  function chips(basePath){
    var arr = getVal(basePath), h = '<ul class="names">';
    for (var i = 0; i < arr.length; i++){
      h += '<li class="chip">'+ed(basePath+"/"+i)+
           '<button class="x" data-del="'+basePath+'/'+i+'" aria-label="Remove name">&times;</button></li>';
    }
    h += '<li><button class="add" data-add="'+basePath+'" data-kind="name">+ Add name</button></li></ul>';
    return h;
  }
  function ico(icon, tone, cls){
    return '<span class="icon '+(tone||"")+(cls?" "+cls:"")+'"><svg viewBox="0 0 24 24"><use href="#'+icon+'"/></svg></span>';
  }
  function delCard(path){ return '<button class="card-del" data-del="'+path+'" aria-label="Remove card">&times;</button>'; }
  function hint(t){ return '<p class="edit-hint">'+t+'</p>'; }
  function head(eyebrow, title, sub){
    return '<div class="head"><p class="eyebrow">'+esc(eyebrow)+'</p><h2 class="title">'+esc(title)+
           '</h2><p class="subtitle">'+esc(sub)+'</p></div>';
  }

  /* ---------- slides ---------- */
  var SLIDES = [
    { name:"Cover", render:function(){
      return '<div class="inner cover"><div>'+
        '<span class="badge"><svg viewBox="0 0 24 24"><use href="#ic-cake"/></svg>'+ed("anniversary")+'</span>'+
        '<h1>'+ed("church/name")+'<span class="city">'+ed("church/city")+'</span></h1>'+
        '<div class="rule"></div>'+
        '<ul class="creed">'+
          D.creed.map(function(_,i){ return '<li>'+ed("creed/"+i)+'</li>'; }).join("")+
        '</ul>'+
        '<div class="verse-block"><p>&ldquo;'+ed("verse/text")+'&rdquo;</p><cite>'+ed("verse/ref")+'</cite></div>'+
        '<p style="margin:18px 0 0;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#6C7C8E;font-weight:600">'+
          ed("docTitle")+' &nbsp;·&nbsp; '+ed("updated")+'</p>'+
      '</div><div class="cover-art"><span class="halo"></span><span class="halo two"></span>'+
        '<img src="'+LOGO+'" alt="Jesus Is Alive Community logo"></div></div>';
    }},

    { name:"Leadership Hierarchy", render:function(){
      var h = '<div class="inner">'+head("Slide 02","Leadership Hierarchy","Spiritual covering and governance of the local body")+
              hint("Tap any name to edit it. Use &times; to remove and + Add name to include someone new.")+'<div class="chain">';
      D.tiers.forEach(function(t,i){
        h += '<div class="tier"><div class="tier-card '+(t.accent||"")+'">'+delCard("tiers/"+i)+
             '<div class="tier-meta"><p class="tier-rank">'+ed("tiers/"+i+"/rank")+'</p>'+
             '<p class="tier-tag">'+ed("tiers/"+i+"/tag")+'</p></div>'+
             chips("tiers/"+i+"/people")+'</div></div>';
        if (i < D.tiers.length - 1)
          h += '<div class="connector"><span class="line"></span><span class="node"></span><span class="line tail"></span></div>';
      });
      h += '<div style="width:100%;max-width:900px;margin-top:14px"><button class="add" data-add="tiers" data-kind="tier">+ Add leadership level</button></div>';
      return h + '</div></div>';
    }},

    { name:"Ministry Leadership", render:function(){
      var h = '<div class="inner">'+head("Slide 03","Ministry Leadership", D.ministries.length+" ministries · each with an appointed head")+
              hint("Edit ministry names and heads directly. Cards can be added or removed.")+'<div class="grid g4">';
      D.ministries.forEach(function(m,i){
        h += '<article class="card ministry">'+delCard("ministries/"+i)+ico(m.icon,m.tone)+
             '<div><p class="m-name">'+ed("ministries/"+i+"/name")+'</p>'+
             '<p class="abbr">'+ed("ministries/"+i+"/abbr")+'</p></div>'+
             '<div class="headline"><p class="role">Head</p><p class="person">'+ed("ministries/"+i+"/head")+'</p></div></article>';
      });
      h += '<button class="add-card" data-add="ministries" data-kind="ministry">+ Add ministry</button>';
      return h + '</div></div>';
    }},

    { name:"Assistant Ministry Heads", render:function(){
      var h = '<div class="inner">'+head("Slide 04","Assistant Ministry Heads","Supporting the ministry heads in day-to-day service")+
              hint("Edit names, initials, and assignments. + Add assignment adds a line.")+'<div class="grid g2">';
      D.assistants.forEach(function(a,i){
        h += '<article class="card">'+delCard("assistants/"+i)+'<div class="assist">'+
             '<span class="avatar '+(a.tone||"")+'">'+ed("assistants/"+i+"/initials")+'</span><div>'+
             '<p class="card-label">Assistant Head</p>'+
             '<p class="card-title">'+ed("assistants/"+i+"/name")+'</p>'+
             '<p class="card-sub">'+ed("assistants/"+i+"/sub")+'</p><ul class="duties">'+
             a.duties.map(function(_,j){
               return '<li><span class="dot"></span>'+ed("assistants/"+i+"/duties/"+j)+
                      '<button class="x" data-del="assistants/'+i+'/duties/'+j+'" aria-label="Remove assignment">&times;</button></li>';
             }).join("")+
             '<li><button class="add" data-add="assistants/'+i+'/duties" data-kind="name">+ Add assignment</button></li>'+
             '</ul></div></div></article>';
      });
      h += '<button class="add-card" data-add="assistants" data-kind="assistant">+ Add assistant head</button>';
      return h + '</div></div>';
    }},

    { name:"Department Workers", render:function(){
      var h = '<div class="inner">'+head("Slide 05 · Christian Music & Arts","Department Workers","Worship, music, and altar service teams")+
              hint("Rosters update live — the count beside each team follows the list.")+'<div class="grid g3">';
      D.cma.forEach(function(g,i){
        h += '<article class="card">'+delCard("cma/"+i)+'<div class="dept-head">'+ico(g.icon,g.tone)+
             '<h4>'+ed("cma/"+i+"/title")+'</h4><span class="count">'+g.people.length+'</span></div>'+
             chips("cma/"+i+"/people")+'</article>';
      });
      h += '<button class="add-card" data-add="cma" data-kind="group">+ Add team</button>';
      return h + '</div></div>';
    }},

    { name:"Administrative Ministries", render:function(){
      var h = '<div class="inner">'+head("Slide 06","Administrative Ministries","Order, communication, and stewardship")+
              hint("Heads and workers are both editable.")+'<div class="grid g3">';
      D.admin.forEach(function(g,i){
        h += '<article class="card">'+delCard("admin/"+i)+'<div class="dept-head">'+ico(g.icon,g.tone)+
             '<h4>'+ed("admin/"+i+"/title")+'</h4></div>'+
             '<div class="role-block"><h5>Head</h5><p class="lead">'+ed("admin/"+i+"/head")+'</p></div>'+
             '<div class="role-block"><h5>Workers</h5>'+chips("admin/"+i+"/people")+'</div></article>';
      });
      h += '<button class="add-card" data-add="admin" data-kind="adminGroup">+ Add ministry</button>';
      return h + '</div></div>';
    }},

    { name:"Leadership Flow", render:function(){
      var h = '<div class="inner">'+head("Slide 07","Leadership Flow","How authority, care, and accountability travel through the church")+
              '<div class="flow">';
      D.flow.forEach(function(s,i){
        h += '<div class="step">'+delCard("flow/"+i)+ico(s.icon,s.tone)+
             '<span class="num">'+(i+1 < 10 ? "0"+(i+1) : i+1)+'</span>'+
             '<h4>'+ed("flow/"+i+"/title")+'</h4><p>'+ed("flow/"+i+"/desc")+'</p>'+
             '<svg class="chev" viewBox="0 0 24 24"><use href="#ic-chev"/></svg></div>';
      });
      h += '<button class="add-card" data-add="flow" data-kind="step">+ Add level</button>';
      return h + '</div></div>';
    }},

    { name:"Closing", render:function(){
      return '<div class="inner closing"><img class="seal" src="'+LOGO+'" alt="Jesus Is Alive Community logo">'+
        '<blockquote>&ldquo;'+ed("closing/quote")+'&rdquo;</blockquote>'+
        '<p class="ref">'+ed("closing/ref")+'</p><div class="divider"></div>'+
        '<p class="footer-name">'+ed("closing/footer")+'</p>'+
        '<p class="footer-sub">'+ed("closing/sub")+'</p>'+
        '<span class="badge" style="margin:22px 0 0"><svg viewBox="0 0 24 24"><use href="#ic-cake"/></svg>'+ed("anniversary")+'</span>'+
      '</div>';
    }}
  ];

  /* ---------- rendering ---------- */
  var stage = document.getElementById("stage");
  var dotsWrap = document.getElementById("dots");
  var curEl = document.getElementById("cur");
  var totEl = document.getElementById("tot");
  var nameEl = document.getElementById("slideName");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");
  var editBtn = document.getElementById("editBtn");
  var resetBtn = document.getElementById("resetBtn");
  var toastEl = document.getElementById("toast");

  function renderDeck(){
    stage.innerHTML = SLIDES.map(function(s,i){
      return '<section class="slide'+(i===idx?" is-active":"")+'" data-name="'+esc(s.name)+'">'+s.render()+'</section>';
    }).join("");
    applyEditable();
  }
  function renderSlide(i){
    var sec = stage.children[i];
    if (!sec) return;
    sec.innerHTML = SLIDES[i].render();
    applyEditable();
  }
  function applyEditable(){
    var eds = stage.querySelectorAll(".ed");
    for (var i = 0; i < eds.length; i++) eds[i].contentEditable = editing ? "true" : "false";
  }
  function buildDots(){
    dotsWrap.innerHTML = "";
    SLIDES.forEach(function(s,n){
      var d = document.createElement("button");
      d.className = "dot" + (n === idx ? " is-active" : "");
      d.setAttribute("aria-label","Go to slide "+(n+1)+": "+s.name);
      d.addEventListener("click", function(){ go(n); });
      dotsWrap.appendChild(d);
    });
    totEl.textContent = String(SLIDES.length).padStart(2,"0");
  }
  function go(n){
    idx = Math.max(0, Math.min(SLIDES.length-1, n));
    for (var i = 0; i < stage.children.length; i++){
      stage.children[i].classList.toggle("is-active", i === idx);
      stage.children[i].scrollTop = 0;
    }
    var dots = dotsWrap.children;
    for (var j = 0; j < dots.length; j++) dots[j].classList.toggle("is-active", j === idx);
    curEl.textContent = String(idx+1).padStart(2,"0");
    nameEl.textContent = SLIDES[idx].name;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === SLIDES.length - 1;
  }
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 1700);
  }

  /* ---------- interactions ---------- */
  stage.addEventListener("click", function(e){
    var addBtn = e.target.closest("[data-add]");
    if (addBtn){
      var arr = getVal(addBtn.getAttribute("data-add"));
      arr.push(newItem(addBtn.getAttribute("data-kind")));
      save(); renderSlide(idx);
      var news = stage.children[idx].querySelectorAll(".ed");
      return;
    }
    var delBtn = e.target.closest("[data-del]");
    if (delBtn){
      delAt(delBtn.getAttribute("data-del"));
      renderSlide(idx);
      return;
    }
  });

  stage.addEventListener("blur", function(e){
    var t = e.target;
    if (t.classList && t.classList.contains("ed")){
      var txt = t.textContent.replace(/\s+/g," ").trim();
      if (!txt){ txt = "—"; t.textContent = txt; }
      setVal(t.getAttribute("data-p"), txt);
      if (/\/people\/|\/duties\//.test(t.getAttribute("data-p"))) { /* counts refresh on next render */ }
    }
  }, true);

  stage.addEventListener("keydown", function(e){
    if (e.target.classList && e.target.classList.contains("ed") && e.key === "Enter"){
      e.preventDefault(); e.target.blur();
    }
  });

  editBtn.addEventListener("click", function(){
    editing = !editing;
    document.body.classList.toggle("editing", editing);
    editBtn.classList.toggle("is-on", editing);
    editBtn.textContent = editing ? "Done" : "Edit";
    applyEditable();
    if (editing) renderSlide(idx);
    toast(editing ? "Editing on — tap any name to change it" : "Changes saved");
  });

  resetBtn.addEventListener("click", function(){
    if (!window.confirm("Restore all original details? Your edits will be replaced.")) return;
    D = clone(DEFAULTS); save(); renderDeck(); go(idx);
    toast("Original details restored");
  });

  document.getElementById("printBtn").addEventListener("click", function(){
    if (editing){ editBtn.click(); }
    toast("Preparing print layout…");
    setTimeout(function(){ window.print(); }, 260);
  });

  prevBtn.addEventListener("click", function(){ go(idx-1); });
  nextBtn.addEventListener("click", function(){ go(idx+1); });

  document.addEventListener("keydown", function(e){
    if (document.activeElement && document.activeElement.isContentEditable) return;
    if (e.key === "ArrowRight" || e.key === "PageDown"){ e.preventDefault(); go(idx+1); }
    if (e.key === "ArrowLeft"  || e.key === "PageUp"){ e.preventDefault(); go(idx-1); }
    if (e.key === "Home") go(0);
    if (e.key === "End") go(SLIDES.length-1);
  });

  var x0 = null, y0 = null;
  document.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if (x0 === null || editing) { x0 = null; return; }
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.6) go(dx < 0 ? idx+1 : idx-1);
    x0 = null; y0 = null;
  }, {passive:true});

  /* ---------- auth ---------- */
  var authWrap = document.getElementById("authWrap");
  var authBtn  = document.getElementById("authBtn");
  var authErr  = document.getElementById("authErr");

  function setSignedIn(s){
    session = s;
    editBtn.hidden = !s;
    resetBtn.hidden = !s;
    authBtn.textContent = s ? "Sign out" : "Sign in";
    if (!s && editing) editBtn.click();
  }

  authBtn.addEventListener("click", function(){
    if (!sb){ toast("Supabase keys not set yet"); return; }
    if (session){
      sb.auth.signOut().then(function(){ setSignedIn(null); toast("Signed out — view only"); });
    } else {
      authErr.textContent = "";
      authWrap.hidden = false;
      document.getElementById("authEmail").focus();
    }
  });
  document.getElementById("authCancel").addEventListener("click", function(){ authWrap.hidden = true; });
  document.getElementById("authGo").addEventListener("click", function(){
    var email = document.getElementById("authEmail").value.trim();
    var pass  = document.getElementById("authPass").value;
    authErr.textContent = "Checking…";
    sb.auth.signInWithPassword({ email: email, password: pass }).then(function(r){
      if (r.error){ authErr.textContent = r.error.message; return; }
      authWrap.hidden = true;
      document.getElementById("authPass").value = "";
      setSignedIn(r.data.session);
      toast("Signed in — you can edit");
    });
  });
  authWrap.addEventListener("keydown", function(e){
    if (e.key === "Enter") document.getElementById("authGo").click();
    if (e.key === "Escape") authWrap.hidden = true;
  });

  if (sb) sb.auth.getSession().then(function(r){ setSignedIn(r.data.session); });
  else setSignedIn(null);

  load(function(){ buildDots(); renderDeck(); go(0); });
})();
</script>
