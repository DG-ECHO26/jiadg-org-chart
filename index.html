          : (NB_SLOWEST_CYCLE + (NB_FASTEST_CYCLE - NB_SLOWEST_CYCLE) * (speed-1) / 19) / 4;
        stepT += dt / beat;

        var from = nbCornerLap(corner, fw, fh), to = nbCornerLap(corner+1, fw, fh);
        lap = from + (to - from) * eased;
        groupA.style.setProperty("--nb-arc", nbBuildArc(lap, borderSize, size.w, size.h, color));
        groupB.style.setProperty("--nb-arc", nbBuildArc(lap+0.5, borderSize, size.w, size.h, color));
      }
      raf = requestAnimationFrame(frame);
    }

      raf = requestAnimationFrame(frame);
      document.addEventListener("visibilitychange", onVis);
    }

      if (raf) cancelAnimationFrame(raf);

      var txt = t.textContent.replace(/\s+/g," ").trim();
      if (!txt){ txt = "—"; t.textContent = txt; }
      setVal(t.getAttribute("data-p"), txt);
      if (/\/people\/|\/duties\//.test(t.getAttribute("data-p"))) { /* counts refresh on next render */ }
    }
  }, true);

  stage.addEventListener("keydown", function(e){
    if (e.target.classList && e.target.classList.contains("ed") && e.key === "Enter"){
      e.preventDefault(); e.target.blur();
    }
  });

  editBtn.addEventListener("click", function(){
    editing = !editing;
    document.body.classList.toggle("editing", editing);
    editBtn.classList.toggle("is-on", editing);
    editBtn.textContent = editing ? "Done" : "Edit";
    renderDeck();
    toast(editing ? "Editing on — tap any name to change it" : "Changes saved");
  });

  resetBtn.addEventListener("click", function(){
    if (!undoStack.length){ toast("Nothing to undo"); return; }
    var prev = undoStack.pop();
    try { localStorage.setItem(UNDO_KEY, JSON.stringify(undoStack)); } catch(e){}
    D = JSON.parse(prev);
    save(); renderDeck(); go(idx);
    toast(undoStack.length ? "Undone — " + undoStack.length + " more step" + (undoStack.length === 1 ? "" : "s") + " available" : "Undone — that was the last change on record");
  });

  document.getElementById("signupBtn").addEventListener("click", function(){
    toast("Sign up link coming soon");
  });

  prevBtn.addEventListener("click", function(){ go(idx-1); });
  nextBtn.addEventListener("click", function(){ go(idx+1); });

  document.addEventListener("keydown", function(e){
    if (document.activeElement && document.activeElement.isContentEditable) return;
    if (e.key === "ArrowRight" || e.key === "PageDown"){ e.preventDefault(); go(idx+1); }
    if (e.key === "ArrowLeft"  || e.key === "PageUp"){ e.preventDefault(); go(idx-1); }
    if (e.key === "Home") go(0);
    if (e.key === "End") go(SLIDES.length-1);
  });

  var x0 = null, y0 = null;
  document.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if (x0 === null || editing) { x0 = null; return; }
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.6) go(dx < 0 ? idx+1 : idx-1);
    x0 = null; y0 = null;
  }, {passive:true});

  /* ---------- auth ---------- */
  var authWrap = document.getElementById("authWrap");
  var authBtn  = document.getElementById("authBtn");
  var authErr  = document.getElementById("authErr");

  function setSignedIn(s){
    session = s;
    editBtn.hidden = !s;
    resetBtn.hidden = !s;
    themeBtn.hidden = !s;
    authBtn.textContent = s ? "Sign out" : "Sign in";
    if (!s && editing) editBtn.click();
  }

  authBtn.addEventListener("click", function(){
    if (!sb){ toast("Supabase keys not set yet"); return; }
    if (session){
      sb.auth.signOut().then(function(){ setSignedIn(null); toast("Signed out — view only"); });
    } else {
      authErr.textContent = "";
      authWrap.hidden = false;
      document.getElementById("authEmail").focus();
    }
  });
  document.getElementById("authCancel").addEventListener("click", function(){ authWrap.hidden = true; });
  document.getElementById("authForm").addEventListener("submit", function(e){
    e.preventDefault();
    var email = document.getElementById("authEmail").value.trim();
    var pass  = document.getElementById("authPass").value;
    authErr.textContent = "Checking…";
    sb.auth.signInWithPassword({ email: email, password: pass }).then(function(r){
      if (r.error){ authErr.textContent = r.error.message; return; }
      authWrap.hidden = true;
      setSignedIn(r.data.session);
      toast("Signed in — you can edit");
    });
  });
  authWrap.addEventListener("keydown", function(e){
    if (e.key === "Escape") authWrap.hidden = true;
  });

  if (sb) sb.auth.getSession().then(function(r){ setSignedIn(r.data.session); });
  else setSignedIn(null);

  /* ---------- theme panel ---------- */
  var themeWrap = document.getElementById("themeWrap");
  var themeGold = document.getElementById("themeGold");
  var themeEmerald = document.getElementById("themeEmerald");

  var ambSwatches = document.getElementById("ambSwatches");
  ambSwatches.innerHTML = Object.keys(AMBIENT_PRESETS).map(function(key){
    var p = AMBIENT_PRESETS[key];
    return '<button type="button" class="amb-swatch" data-amb="'+key+'" title="'+p.label+'" style="background:'+p.swatch+'">'+
      '<span class="amb-check"><svg viewBox="0 0 24 24"><use href="#ic-check"/></svg></span></button>';
  }).join("");
  function refreshAmbSwatches(){
    var cur = D.ambientTheme || "ivory";
    ambSwatches.querySelectorAll(".amb-swatch").forEach(function(b){
      b.classList.toggle("is-active", b.getAttribute("data-amb") === cur);
    });
  }
  ambSwatches.addEventListener("click", function(e){
    var btn = e.target.closest(".amb-swatch");
    if (!btn) return;
    pushUndo();
    var newKey = btn.getAttribute("data-amb");
    var goingDark = !!(AMBIENT_PRESETS[newKey] && AMBIENT_PRESETS[newKey].dark);
    var wasDark = !!(AMBIENT_PRESETS[D.ambientTheme] && AMBIENT_PRESETS[D.ambientTheme].dark);
    // Only swap accent defaults for anyone still on the untouched defaults —
    // real customizations (picked via the color inputs) are always kept.
    if (goingDark && !wasDark && D.theme.gold === DEFAULTS.theme.gold && D.theme.emerald === DEFAULTS.theme.emerald){
      D.theme = clone(NAVY_ACCENT);
    } else if (!goingDark && wasDark && D.theme.gold === NAVY_ACCENT.gold && D.theme.emerald === NAVY_ACCENT.emerald){
      D.theme = clone(DEFAULTS.theme);
    }
    D.ambientTheme = newKey;
    applyAmbientTheme();
    applyTheme();
    themeGold.value = D.theme.gold;
    themeEmerald.value = D.theme.emerald;
    refreshAmbSwatches();
    save();
  });

  themeBtn.addEventListener("click", function(){
    pushUndo();
    themeGold.value = D.theme.gold;
    themeEmerald.value = D.theme.emerald;
    refreshAmbSwatches();
    themeWrap.hidden = false;
  });
  function onThemeInput(){
    D.theme.gold = themeGold.value;
    D.theme.emerald = themeEmerald.value;
    applyTheme();
    save();
  }
  themeGold.addEventListener("input", onThemeInput);
  themeEmerald.addEventListener("input", onThemeInput);
  document.getElementById("themeReset").addEventListener("click", function(){
    D.theme = clone(DEFAULTS.theme);
    D.ambientTheme = DEFAULTS.ambientTheme;
    themeGold.value = D.theme.gold;
    themeEmerald.value = D.theme.emerald;
    applyTheme();
    applyAmbientTheme();
    refreshAmbSwatches();
    save();
  });
  document.getElementById("themeDone").addEventListener("click", function(){ themeWrap.hidden = true; });
  themeWrap.addEventListener("keydown", function(e){ if (e.key === "Escape") themeWrap.hidden = true; });

  /* ---------- icon picker ---------- */
  var ICON_OPTIONS = ["ic-star","ic-heart","ic-people","ic-hands","ic-crown","ic-shepherd","ic-check",
    "ic-admin","ic-media","ic-finance","ic-book","ic-music","ic-mic","ic-guitar","ic-tambourine",
    "ic-speaker","ic-prayer","ic-van","ic-cake","ic-church","ic-calendar","ic-trophy"];
  var iconWrap = document.getElementById("iconWrap");
  var iconGrid = document.getElementById("iconGrid");
  var toneRow = document.getElementById("toneRow");
  var iconPickPath = null;
  iconGrid.innerHTML = ICON_OPTIONS.map(function(id){
    return '<button type="button" class="icon-opt" data-icon="'+id+'"><svg viewBox="0 0 24 24"><use href="#'+id+'"/></svg></button>';
  }).join("");

  function refreshIconPicker(){
    if (!iconPickPath) return;
    var cur = getVal(iconPickPath);
    var curTone = getVal(iconPickPath.replace(/\/icon$/, "/tone"));
    iconGrid.querySelectorAll(".icon-opt").forEach(function(b){
      b.classList.toggle("is-active", b.getAttribute("data-icon") === cur);
    });
    toneRow.querySelectorAll(".tone-opt").forEach(function(b){
      b.classList.toggle("is-active", b.getAttribute("data-tone") === (curTone || ""));
    });
  }

  stage.addEventListener("click", function(e){
    var iconBtn = e.target.closest("[data-iconpick]");
    if (iconBtn){
      iconPickPath = iconBtn.getAttribute("data-iconpick") + "/icon";
      refreshIconPicker();
      iconWrap.hidden = false;
    }
  });
  iconGrid.addEventListener("click", function(e){
    var opt = e.target.closest(".icon-opt");
    if (!opt || !iconPickPath) return;
    setVal(iconPickPath, opt.getAttribute("data-icon"));
    refreshIconPicker();
    renderSlide(idx);
  });
  toneRow.addEventListener("click", function(e){
    var opt = e.target.closest(".tone-opt");
    if (!opt || !iconPickPath) return;
    setVal(iconPickPath.replace(/\/icon$/, "/tone"), opt.getAttribute("data-tone"));
    refreshIconPicker();
    renderSlide(idx);
  });
  document.getElementById("iconDone").addEventListener("click", function(){ iconWrap.hidden = true; iconPickPath = null; });
  iconWrap.addEventListener("keydown", function(e){ if (e.key === "Escape"){ iconWrap.hidden = true; iconPickPath = null; } });

  /* ---------- drag-to-reorder ---------- */
  var dragSrc = null;
  stage.addEventListener("mousedown", function(e){
    var handle = e.target.closest(".drag-handle");
    if (!handle) return;
    var card = handle.closest("[data-drag-list]");
    if (card) card.setAttribute("draggable", "true");
  });
  document.addEventListener("mouseup", function(){
    var cards = stage.querySelectorAll('[data-drag-list][draggable="true"]');
    for (var i = 0; i < cards.length; i++) cards[i].setAttribute("draggable", "false");
  });
  stage.addEventListener("dragstart", function(e){
    var card = e.target.closest("[data-drag-list]");
    if (!card || card.getAttribute("draggable") !== "true"){ e.preventDefault(); return; }
    dragSrc = { list: card.getAttribute("data-drag-list"), index: +card.getAttribute("data-drag-index") };
    e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", ""); }catch(err){}
    card.classList.add("dragging");
  });
  stage.addEventListener("dragover", function(e){
    if (!dragSrc) return;
    var card = e.target.closest("[data-drag-list]");
    if (!card || card.getAttribute("data-drag-list") !== dragSrc.list) return;
    e.preventDefault();
    card.classList.add("drag-over");
  });
  stage.addEventListener("dragleave", function(e){
    var card = e.target.closest("[data-drag-list]");
    if (card) card.classList.remove("drag-over");
  });
  stage.addEventListener("drop", function(e){
    if (!dragSrc) return;
    var card = e.target.closest("[data-drag-list]");
    if (card && card.getAttribute("data-drag-list") === dragSrc.list){
      e.preventDefault();
      var toIndex = +card.getAttribute("data-drag-index");
      if (toIndex !== dragSrc.index){
        var arr = getVal(dragSrc.list);
        pushUndo();
        var item = arr.splice(dragSrc.index, 1)[0];
        arr.splice(toIndex, 0, item);
        save();
        renderSlide(idx);
      }
    }
    dragSrc = null;
  });
  stage.addEventListener("dragend", function(){
    var els = stage.querySelectorAll(".dragging, .drag-over, [data-drag-list]");
    for (var i = 0; i < els.length; i++){
      els[i].classList.remove("dragging", "drag-over");
      els[i].setAttribute("draggable", "false");
    }
    dragSrc = null;
  });

  /* ---------- profile side-sheet ---------- */
  var profileWrap = document.getElementById("profileWrap");
  var profileContent = document.getElementById("profileContent");
  function renderProfile(name){
    var roles = collectRoles(name);
    var photo = "";
    roles.forEach(function(r){ if (!photo && r.photo) photo = r.photo; });
    var initials = String(name).split(/\s+/).map(function(w){ return w[0] || ""; }).join("").slice(0,2).toUpperCase();
    var avatarInner = photo ? '<img src="'+esc(photo)+'" alt="">' : esc(initials || "?");
    var heroRole = roles.length ? roles[0].title : "Member";
    var rolesHtml = roles.map(function(r){
      return '<li class="profile-role-row">'+ico(r.icon, r.tone)+
        '<span class="pr-text"><span class="pr-title">'+esc(r.title)+'</span>'+
        (r.sub ? '<span class="pr-sub">'+esc(r.sub)+'</span>' : '')+'</span></li>';
    }).join("");
    var metaHtml = "";
    roles.forEach(function(r){
      if (r.timing && !/to be added/i.test(r.timing)) metaHtml += '<li><svg viewBox="0 0 24 24"><use href="#ic-clock"/></svg>'+esc(r.timing)+'</li>';
      if (r.location && !/to be added/i.test(r.location)) metaHtml += '<li><svg viewBox="0 0 24 24"><use href="#ic-pin"/></svg>'+esc(r.location)+'</li>';
      if (r.desc && !/to be added/i.test(r.desc)) metaHtml += '<li><svg viewBox="0 0 24 24"><use href="#ic-book"/></svg>'+esc(r.desc)+'</li>';
    });
    profileContent.innerHTML =
      '<div class="profile-hero"><div class="profile-avatar">'+avatarInner+'<span class="profile-avatar-dot"></span></div>'+
      '<p class="profile-name">'+esc(name)+'</p><p class="profile-role">'+esc(heroRole)+'</p></div>'+
      '<div class="profile-body">'+
        '<div><p class="profile-section-label">Roles &amp; Ministries</p>'+
          (rolesHtml ? '<ul class="profile-roles">'+rolesHtml+'</ul>' : '<p class="profile-empty">No additional roles on record.</p>')+
        '</div>'+
        (metaHtml ? '<div><p class="profile-section-label">Serving Details</p><ul class="profile-meta-list">'+metaHtml+'</ul></div>' : '')+
      '</div>';
  }
  function openProfile(name){
    if (!name) return;
    renderProfile(name);
    profileWrap.hidden = false;
    requestAnimationFrame(function(){ profileWrap.classList.add("is-open"); });
  }
  function closeProfile(){
    profileWrap.classList.remove("is-open");
    setTimeout(function(){ profileWrap.hidden = true; }, 380);
  }
  document.getElementById("profileClose").addEventListener("click", closeProfile);
  document.getElementById("profileScrim").addEventListener("click", closeProfile);
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && profileWrap.classList.contains("is-open")) closeProfile();
  });

  /* ---------- Cmd/Ctrl+K spotlight search ---------- */
  var spotlightWrap = document.getElementById("spotlightWrap");
  var spotlightInput = document.getElementById("spotlightInput");
  var spotlightResults = document.getElementById("spotlightResults");
  var spotlightItems = [], spotlightActive = -1;

  function slideIndexByName(name){
    for (var i = 0; i < SLIDES.length; i++) if (SLIDES[i].name === name) return i;
    return 0;
  }
  function buildSearchIndex(){
    var items = [];
    SLIDES.forEach(function(s, i){
      items.push({ title:s.name, sub:"Section", icon:SLIDE_ICONS[s.name] || "ic-star",
        run:function(){ closeSpotlight(); go(i); } });
    });
    D.ministries.forEach(function(m){
      items.push({ title:m.name, sub:"Ministry · Head "+m.head, icon:m.icon,
        run:function(){ closeSpotlight(); go(slideIndexByName("Ministry Leadership")); } });
    });
    D.dgroups.forEach(function(g){
      items.push({ title:g.group, sub:"Bible Study · "+g.leaders, icon:"ic-book",
        run:function(){ closeSpotlight(); go(slideIndexByName("Bible Studies")); } });
    });
    D.growthTrack.steps.forEach(function(s){
      items.push({ title:s.title, sub:"Growth Track", icon:s.icon,
        run:function(){ closeSpotlight(); go(slideIndexByName("Growth Track")); } });
    });
    collectAllNames().forEach(function(n){
      var roles = collectRoles(n);
      var sub = roles.length ? (roles[0].title + (roles[0].sub ? " · "+roles[0].sub : "")) : "Person";
      items.push({ title:n, sub:sub, icon:"ic-people", run:function(){ closeSpotlight(); openProfile(n); } });
    });
    return items;
  }
  function highlightMatch(text, q){
    if (!q) return esc(text);
    var i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i === -1) return esc(text);
    return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i, i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
  }
  function highlightSpotlightActive(){
    var nodes = spotlightResults.querySelectorAll(".spotlight-item");
    for (var i = 0; i < nodes.length; i++) nodes[i].classList.toggle("is-active", i === spotlightActive);
    if (nodes[spotlightActive]) nodes[spotlightActive].scrollIntoView({block:"nearest"});
  }
  function renderSpotlightResults(q){
    var all = buildSearchIndex();
    var query = q.trim().toLowerCase();
    var filtered = !query ? all.slice(0, 8) : all.filter(function(it){
      return it.title.toLowerCase().indexOf(query) !== -1 || (it.sub || "").toLowerCase().indexOf(query) !== -1;
    }).slice(0, 30);
    spotlightItems = filtered;
    spotlightActive = filtered.length ? 0 : -1;
    if (!filtered.length){
      spotlightResults.innerHTML = '<p class="spotlight-empty">No matches for &ldquo;'+esc(q)+'&rdquo;</p>';
      return;
    }
    spotlightResults.innerHTML = filtered.map(function(it, i){
      return '<button type="button" class="spotlight-item'+(i===0?" is-active":"")+'" data-si-index="'+i+'" role="option">'+
        '<span class="si-icon"><svg viewBox="0 0 24 24"><use href="#'+it.icon+'"/></svg></span>'+
        '<span class="si-text"><span class="si-title">'+highlightMatch(it.title, q)+'</span>'+
        '<span class="si-sub">'+esc(it.sub || "")+'</span></span>'+
        '<svg class="si-arrow" viewBox="0 0 24 24"><use href="#ic-arrow-r"/></svg></button>';
    }).join("");
  }
  function openSpotlight(){
    spotlightWrap.hidden = false;
    spotlightInput.value = "";
    renderSpotlightResults("");
    setTimeout(function(){ spotlightInput.focus(); }, 10);
  }
  function closeSpotlight(){ spotlightWrap.hidden = true; }
  document.getElementById("searchTrigger").addEventListener("click", openSpotlight);
  document.addEventListener("keydown", function(e){
    if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")){
      e.preventDefault();
      if (spotlightWrap.hidden) openSpotlight(); else closeSpotlight();
    }
  });
  spotlightWrap.addEventListener("mousedown", function(e){ if (e.target === spotlightWrap) closeSpotlight(); });
  spotlightWrap.addEventListener("keydown", function(e){
    if (e.key === "Escape"){ closeSpotlight(); return; }
    if (e.key === "ArrowDown"){ e.preventDefault(); if (spotlightItems.length){ spotlightActive = (spotlightActive+1) % spotlightItems.length; highlightSpotlightActive(); } }
    if (e.key === "ArrowUp"){ e.preventDefault(); if (spotlightItems.length){ spotlightActive = (spotlightActive-1+spotlightItems.length) % spotlightItems.length; highlightSpotlightActive(); } }
    if (e.key === "Enter"){ e.preventDefault(); if (spotlightItems[spotlightActive]) spotlightItems[spotlightActive].run(); }
  });
  spotlightInput.addEventListener("input", function(){ renderSpotlightResults(spotlightInput.value); });
  spotlightResults.addEventListener("click", function(e){
    var btn = e.target.closest("[data-si-index]");
    if (btn && spotlightItems[+btn.getAttribute("data-si-index")]) spotlightItems[+btn.getAttribute("data-si-index")].run();
  });
  spotlightResults.addEventListener("mousemove", function(e){
    var btn = e.target.closest("[data-si-index]");
    if (!btn) return;
    var i = +btn.getAttribute("data-si-index");
    if (i !== spotlightActive){ spotlightActive = i; highlightSpotlightActive(); }
  });

  /* ---------- profile trigger, filter chips, tree collapse — delegated on stage ---------- */
  stage.addEventListener("click", function(e){
    var faithTabBtn = e.target.closest("[data-faith-tab]");
    if (faithTabBtn){
      faithTab = faithTabBtn.getAttribute("data-faith-tab");
      var bar = faithTabBtn.closest(".faith-tabbar");
      bar.querySelectorAll(".faith-tab").forEach(function(b){
        var on = b === faithTabBtn;
        b.classList.toggle("is-active", on);
        b.setAttribute("aria-selected", on ? "true" : "false");
      });
      var panels = bar.closest(".faith-tabs-wrap").querySelector(".faith-tab-panels");
      panels.querySelectorAll(".faith-panel").forEach(function(p){
        p.classList.toggle("is-active", p.getAttribute("data-faith-panel") === faithTab);
      });
      positionFaithIndicator();
      return;
    }
    var filterBtn = e.target.closest("[data-filter]");
    if (filterBtn){
      var val = filterBtn.getAttribute("data-filter");
      var group = filterBtn.closest(".filter-chips");
      group.querySelectorAll(".filter-chip").forEach(function(b){ b.classList.toggle("is-active", b === filterBtn); });
      var grid = group.nextElementSibling;
      if (grid) grid.querySelectorAll(".ministry").forEach(function(card){
        var i = +card.getAttribute("data-drag-index");
        var abbr = D.ministries[i] ? D.ministries[i].abbr : "";
        card.classList.toggle("is-filtered-out", val !== "all" && abbr !== val);
      });
      return;
    }
    var collapseBtn = e.target.closest("[data-tree-collapse]");
    if (collapseBtn){
      var tpath = collapseBtn.getAttribute("data-tree-collapse");
      treeCollapsed[tpath] = !treeCollapsed[tpath];
      collapseBtn.closest("li").classList.toggle("is-collapsed", treeCollapsed[tpath]);
      return;
    }
    var zoomBtn = e.target.closest("[data-zoom-in],[data-zoom-out],[data-zoom-reset]");
    if (zoomBtn){
      var net = zoomBtn.closest(".dg-net");
      var zoomEl = net.querySelector(".ftree-zoom");
      var pctEl = net.querySelector("[data-zoom-pct]");
      var cur = parseFloat(net.getAttribute("data-zoom") || "1");
      if (zoomBtn.hasAttribute("data-zoom-in")) cur = Math.min(1.6, cur + .1);
      else if (zoomBtn.hasAttribute("data-zoom-out")) cur = Math.max(.5, cur - .1);
      else cur = 1;
      net.setAttribute("data-zoom", cur.toFixed(2));
      zoomEl.style.transform = "scale(" + cur.toFixed(2) + ")";
      pctEl.textContent = Math.round(cur*100) + "%";
      return;
    }
    if (editing) return;
    var profileEl = e.target.closest("[data-profile]");
    if (profileEl) openProfile(profileEl.getAttribute("data-profile"));
  });

  /* drag-to-pan on family-tree viewports */
  stage.addEventListener("mousedown", function(e){
    var scrollEl = e.target.closest(".ftree-scroll");
    if (!scrollEl || e.target.closest(".tnode, .dg-net-toolbar")) return;
    e.preventDefault();
    var startX = e.clientX, startY = e.clientY;
    var startLeft = scrollEl.scrollLeft, startTop = scrollEl.scrollTop;
    scrollEl.classList.add("is-panning");
    function onMove(ev){
      scrollEl.scrollLeft = startLeft - (ev.clientX - startX);
      scrollEl.scrollTop = startTop - (ev.clientY - startY);
    }
    function onUp(){
      scrollEl.classList.remove("is-panning");
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });

  load(function(){ applyTheme(); applyAmbientTheme(); buildDots(); renderDeck(); go(0); updateCountdown(); setInterval(updateCountdown, 1000); });
})();
</script>
