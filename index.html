<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIA DG - DUBAI ORG Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#1D1D1F; --navy-2:#000000; --navy-3:#000000;
    --gold:#A6841A; --gold-2:#8C6F14; --gold-dim:rgba(166,132,26,.10);
    --emerald:#1F7A4D; --emerald-dim:rgba(31,122,77,.10);
    --amber:#B45309; --danger:#C0392B;
    --ink:#1D1D1F; --soft:#6E6E73; --muted:#8E8E93;
    --bg:#F8F8FA; --bg-2:#F0F0F3; --surface:#FFFFFF;
    --glass:rgba(255,255,255,.62);
    --glass-2:rgba(255,255,255,.94);
    --glass-border:rgba(255,255,255,.55);
    --edge:rgba(60,60,67,.09);
    --edge-2:rgba(60,60,67,.15);
    --shadow-xs:0 1px 2px rgba(16,24,40,.03), 0 2px 8px rgba(16,24,40,.04);
    --shadow-sm:0 2px 8px rgba(16,24,40,.04), 0 10px 26px rgba(16,24,40,.06);
    --shadow-md:0 6px 20px rgba(16,24,40,.06), 0 24px 60px rgba(16,24,40,.10);
    --shadow-lg:0 20px 50px rgba(16,24,40,.10), 0 40px 90px rgba(16,24,40,.14);
    --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:26px; --r-2xl:28px;
    --ease:cubic-bezier(.22,1,.36,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --sidebar-w:240px; --sidebar-w-rail:84px;
    --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Helvetica,Arial,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  /* ---- Navy theme (select "Navy" in the Theme panel's ambient swatches) ----
     Overrides the shared tokens above; every component below already reads
     these via var(), so this block is enough to re-skin the whole deck.
     --gold/--gold-2/--gold-dim/--emerald/--emerald-dim are deliberately left
     out here — those are set on <html> by applyTheme() from D.theme, and a
     declaration here would permanently shadow that for every element under
     body, breaking the live accent-color picker while navy is active. */
  body.theme-navy{
    color-scheme:dark;
    --ink:#EAF1F9; --soft:#C3D2E3; --muted:#8DA2BA;
    --bg:#0B1B2E; --bg-2:#16324F; --surface:#132D4A;
    --glass:rgba(255,255,255,.045);
    --glass-2:rgba(255,255,255,.075);
    --glass-border:rgba(255,255,255,.14);
    --edge:rgba(255,255,255,.10);
    --edge-2:rgba(255,255,255,.16);
    --shadow-xs:0 1px 0 rgba(255,255,255,.04) inset, 0 2px 10px rgba(0,0,0,.24);
    --shadow-sm:0 1px 0 rgba(255,255,255,.05) inset, 0 10px 26px rgba(0,0,0,.30);
    --shadow-md:0 1px 0 rgba(255,255,255,.06) inset, 0 22px 48px rgba(0,0,0,.42);
    --shadow-lg:0 1px 0 rgba(255,255,255,.06) inset, 0 34px 80px rgba(0,0,0,.50);
    --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  }
  /* These three fill with --ink as a solid "inverse" chip in the light theme;
     on navy, --ink is a light text color, so they'd render invisible unless
     swapped to a gold fill instead. */
  body.theme-navy .tool.is-on{background:var(--gold);color:#10243C;border-color:var(--gold)}
  body.theme-navy .toast{background:var(--gold);color:#10243C}
  body.theme-navy .filter-chip.is-active{background:var(--gold);border-color:var(--gold);color:#10243C}
  body.theme-navy .tier-card::before{background:#5C8BC4;box-shadow:0 0 20px rgba(92,139,196,.7)}

  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  ::selection{background:var(--gold-dim);color:var(--ink)}

  /* ---- Ambient field: soft aurora blobs, off-white base, never pure black/harsh ---- */
  .ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    background:
      radial-gradient(38% 32% at 12% 8%, rgba(166,132,26,.10) 0%, rgba(166,132,26,0) 70%),
      radial-gradient(42% 36% at 88% 6%, rgba(31,122,77,.08) 0%, rgba(31,122,77,0) 70%),
      radial-gradient(46% 40% at 96% 92%, rgba(166,132,26,.09) 0%, rgba(166,132,26,0) 70%),
      radial-gradient(40% 34% at 4% 96%, rgba(30,58,95,.06) 0%, rgba(30,58,95,0) 70%),
      linear-gradient(180deg,#FAFAFC 0%,#F8F8FA 55%,#F4F4F7 100%);
  }
  .liquid-bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;opacity:.08}

  .deck{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}

  /* ---- Top bar: slim glass strip ---- */
  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:14px clamp(16px,2.4vw,32px);
    -webkit-backdrop-filter:blur(28px) saturate(1.7);backdrop-filter:blur(28px) saturate(1.7);
    background:var(--glass-2);border-bottom:1px solid var(--edge);position:relative;z-index:5}
  .mark{display:flex;align-items:center;gap:10px;min-width:0;flex:0 0 auto}
  .mark img{width:30px;height:30px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 6px rgba(16,24,40,.14))}
  .mark .name{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mark .name span{color:var(--gold-2);font-weight:600}
  .search-trigger{display:flex;align-items:center;gap:9px;flex:1 1 auto;max-width:420px;margin:0 clamp(8px,2vw,28px);
    background:var(--bg-2);border:1px solid var(--edge);color:var(--muted);border-radius:99px;
    padding:8px 14px;font-family:var(--body);font-size:12.5px;font-weight:500;cursor:pointer;
    transition:background .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease),transform .18s var(--ease)}
  .search-trigger:hover{background:var(--surface);border-color:var(--edge-2);box-shadow:var(--shadow-xs);transform:translateY(-1px)}
  .search-trigger svg{width:14px;height:14px;flex:0 0 auto;color:var(--muted)}
  .search-trigger span.q{flex:1 1 auto;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .search-trigger kbd{flex:0 0 auto;font-family:var(--body);font-size:10px;font-weight:600;color:var(--soft);
    background:var(--surface);border:1px solid var(--edge-2);border-radius:6px;padding:2px 6px;box-shadow:0 1px 0 rgba(16,24,40,.05)}
  .bar-tools{display:flex;align-items:center;gap:7px;flex:0 0 auto;margin-left:auto}
  .tool{border:1px solid var(--edge-2);background:var(--surface);color:var(--soft);font-family:var(--body);
    font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:8px 15px;border-radius:99px;
    cursor:pointer;transition:background .22s var(--ease),color .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease),transform .18s var(--ease-spring);white-space:nowrap}
  .tool:hover{background:var(--bg-2);color:var(--ink);border-color:var(--edge-2);transform:translateY(-1px) scale(1.02);box-shadow:var(--shadow-xs)}
  .tool:active{transform:translateY(0) scale(.98)}
  .tool.is-on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tool.is-on:hover{background:#000;color:#fff}
  .tool.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .tool.ghost:hover{color:var(--ink);background:var(--bg-2);box-shadow:none}
  .counter{display:flex;align-items:baseline;gap:6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap}
  .counter b{font-size:14px;color:var(--ink);font-weight:700;letter-spacing:.01em}

  /* ---- App body: sidebar rail + stage ---- */
  .app-body{flex:1 1 auto;display:flex;min-height:0;position:relative}

  /* ---- Stage ---- */
  .stage{flex:1 1 auto;position:relative;overflow:hidden;min-width:0}
  .slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
    padding:clamp(20px,3.4vh,44px) clamp(18px,3vw,56px) clamp(60px,8vh,90px);
    opacity:0;visibility:hidden;transform:translateY(14px) scale(.99);
    transition:opacity .48s var(--ease),transform .48s var(--ease),visibility .48s;
    display:flex;flex-direction:column}
  .slide.is-active{opacity:1;visibility:visible;transform:none}
  .slide::-webkit-scrollbar{width:8px}
  .slide::-webkit-scrollbar-thumb{background:rgba(16,24,40,.12);border-radius:99px}
  /* margin:auto (not .slide{justify-content:center}) so short slides still center
     vertically, but tall ones collapse the auto margin to 0 and stay reachable by
     scroll from the top — justify-content:center traps overflow above scrollTop:0 */
  .inner{width:100%;max-width:1180px;margin:auto}

  /* ---- Type ---- */
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--soft);margin:0 0 10px;
    opacity:0;animation:riseIn .5s var(--ease) forwards}
  .eyebrow::before{content:"";width:20px;height:1.5px;background:linear-gradient(90deg,rgba(166,132,26,0),var(--gold));border-radius:2px}
  h2.title{font-family:var(--display);font-size:clamp(28px,3.6vw,40px);line-height:1.1;letter-spacing:-.02em;font-weight:700;
    color:var(--ink);margin:0 0 8px;opacity:0;animation:riseIn .55s var(--ease) .05s forwards}
  .subtitle{font-size:clamp(13px,1.2vw,15.5px);color:var(--soft);margin:0;font-weight:400;line-height:1.5;
    opacity:0;animation:riseIn .55s var(--ease) .1s forwards}
  .head{margin-bottom:clamp(20px,3vh,34px)}
  @keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){.eyebrow,h2.title,.subtitle{animation:none;opacity:1}}

  /* ---- Anniversary badge ---- */
  .badge{display:inline-flex;align-items:center;gap:9px;
    background:var(--gold-dim);
    border:1px solid rgba(166,132,26,.24);color:var(--gold-2);border-radius:99px;padding:8px 18px 8px 14px;
    font-size:clamp(10.5px,1.1vw,12px);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    margin-bottom:18px;transition:transform .22s var(--ease-spring),box-shadow .22s var(--ease)}
  .badge:hover{transform:translateY(-1px) scale(1.02)}
  .badge svg{width:15px;height:15px;color:var(--gold);flex:0 0 auto}

  /* ---- Cover ---- */
  .cover{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(22px,4vw,60px);align-items:center}
  .cover-copy{background:var(--glass);-webkit-backdrop-filter:blur(32px) saturate(1.4);backdrop-filter:blur(32px) saturate(1.4);
    border:1px solid var(--glass-border);border-radius:var(--r-2xl);padding:clamp(24px,3.4vw,40px);box-shadow:var(--shadow-md)}
  .cover h1{font-family:var(--display);font-size:clamp(32px,4.6vw,50px);line-height:1.08;letter-spacing:-.024em;font-weight:700;
    color:var(--ink);margin:0}
  .cover .city{display:block;font-family:var(--body);font-size:.34em;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--gold-2);margin-top:12px}
  .rule{width:64px;height:2px;background:linear-gradient(90deg,var(--gold),rgba(166,132,26,0));border-radius:3px;margin:20px 0 22px}

  /* ---- Dashboard stat cards (Main Page) ---- */
  .stat-row-label{margin:22px 0 0;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
  .stat-card{position:relative;background:var(--glass-2);border:1px solid var(--edge);border-radius:var(--r-md);
    padding:14px 14px 13px;box-shadow:var(--shadow-xs);transition:transform .26s var(--ease),box-shadow .26s var(--ease)}
  .stat-card:hover{transform:translateY(-3px) scale(1.015);box-shadow:var(--shadow-sm)}
  body.editing .stat-card{padding-top:34px}
  .stat-num{font-family:var(--display);font-size:clamp(20px,2.4vw,26px);font-weight:700;color:var(--ink);line-height:1;letter-spacing:-.01em}
  .stat-label{margin:6px 0 0;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media (max-width:560px){.stat-row{grid-template-columns:repeat(2,1fr)}}

  /* ---- Anniversary countdown ---- */
  .countdown{position:relative;grid-column:1/-1;order:-2;overflow:visible;margin-bottom:clamp(8px,2vh,20px);
    padding:clamp(24px,3.4vw,36px) clamp(16px,3vw,32px) clamp(22px,2.6vw,30px);text-align:center;
    border-radius:var(--r-2xl);background:var(--glass-2);-webkit-backdrop-filter:blur(28px) saturate(1.3);backdrop-filter:blur(28px) saturate(1.3);
    border:1px solid var(--glass-border);box-shadow:var(--shadow-lg);
    animation:cdIn .8s cubic-bezier(.2,.7,.3,1) both, cdGlow 4s ease-in-out .8s infinite}
  @keyframes cdIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes cdGlow{0%,100%{box-shadow:var(--shadow-md),0 0 0 0 rgba(166,132,26,.10)}
    50%{box-shadow:var(--shadow-md),0 0 30px 2px rgba(166,132,26,.14)}}
  .countdown .spark{display:none;position:absolute;width:4px;height:4px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 8px 2px rgba(166,132,26,.6);pointer-events:none}
  .countdown.is-live .spark{display:block;animation:cdSpark 1.8s ease-in-out infinite}
  @keyframes cdSpark{0%,100%{opacity:0;transform:scale(.4) translateY(0)}50%{opacity:1;transform:scale(1.3) translateY(-6px)}}
  .spark.s1{top:14%;left:6%}
  .spark.s2{top:22%;left:92%;animation-delay:.3s;background:var(--emerald);box-shadow:0 0 8px 2px rgba(31,122,77,.55)}
  .spark.s3{top:76%;left:4%;animation-delay:.6s}
  .spark.s4{top:80%;left:94%;animation-delay:.9s;background:var(--emerald);box-shadow:0 0 8px 2px rgba(31,122,77,.55)}
  .spark.s5{top:8%;left:50%;animation-delay:1.2s}
  .spark.s6{top:88%;left:48%;animation-delay:1.5s}
  .countdown-label{margin:0 0 clamp(16px,2.6vh,24px);font-size:10px;letter-spacing:.26em;text-transform:uppercase;
    font-weight:700;color:var(--gold-2)}
  .countdown-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(9px,2vw,16px);
    max-width:420px;margin:0 auto}
  .flip-tile{position:relative;display:flex;flex-direction:column;aspect-ratio:1/1.06;border-radius:16px;
    overflow:hidden;background:linear-gradient(165deg,#26262A,#1A1A1D);
    border:1px solid rgba(166,132,26,.3);
    box-shadow:0 12px 28px rgba(16,24,40,.18),inset 0 1px 0 rgba(255,255,255,.08);
    opacity:0;animation:cdTileIn .6s cubic-bezier(.2,.7,.3,1) forwards}
  .flip-tile:nth-child(1){animation-delay:.15s}
  .flip-tile:nth-child(2){animation-delay:.28s}
  .flip-tile:nth-child(3){animation-delay:.41s}
  .flip-tile:nth-child(4){animation-delay:.54s}
  @keyframes cdTileIn{0%{opacity:0;transform:translateY(10px) scale(.92)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .flip-face{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;perspective:240px}
  .flip-face::after{content:"";position:absolute;left:9%;right:9%;top:50%;height:1px;
    background:rgba(255,255,255,.14);transform:translateY(-50%);z-index:2}
  .countdown-num{font-family:var(--display);font-weight:700;font-size:clamp(22px,6.4vw,36px);color:#fff;
    line-height:1;font-variant-numeric:tabular-nums;
    display:inline-block;transform-style:preserve-3d}
  .countdown-num.tick{animation:cdFlip .55s cubic-bezier(.32,.1,.28,1)}
  @keyframes cdFlip{0%{transform:rotateX(0)}40%{transform:rotateX(-100deg);opacity:.4}
    41%{transform:rotateX(80deg)}100%{transform:rotateX(0);opacity:1}}
  .countdown-tag{padding:5px 0 7px;text-align:center;font-size:8px;letter-spacing:.15em;text-transform:uppercase;
    color:rgba(255,255,255,.6);font-weight:600;background:rgba(0,0,0,.14)}
  .countdown-live-msg{display:none;margin:0;font-family:var(--display);font-size:clamp(18px,3vw,25px);font-weight:700;color:var(--gold-2)}
  .countdown.is-live .countdown-grid{display:none}
  .countdown.is-live .countdown-live-msg{display:block}
  .countdown-date{margin:clamp(14px,2.2vh,20px) 0 0;font-size:11px;color:var(--soft);font-weight:500;letter-spacing:.01em}
  .countdown-edit-label{display:none;margin-top:14px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);font-weight:600;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px}
  body.editing .countdown-edit-label{display:flex}
  .countdown-edit{background:var(--surface);border:1px solid var(--edge-2);color:var(--ink);color-scheme:light;
    font-family:var(--body);font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;padding:5px 8px;border-radius:7px}

  .creed{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:9px}
  .creed li{display:flex;align-items:center;gap:11px;font-size:clamp(12.5px,1.4vw,16px);color:var(--soft);font-weight:500}
  .creed li::before{content:"";width:6px;height:6px;flex:0 0 auto;border-radius:50%;background:var(--emerald)}
  .verse-block{border-left:2px solid var(--gold);padding:4px 0 4px 18px}
  .verse-block p{margin:0;font-family:var(--display);font-size:clamp(15px,1.8vw,21px);line-height:1.4;color:var(--ink);font-weight:500;font-style:italic}
  .verse-block cite{display:block;margin-top:8px;font-family:var(--body);font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .mission-block{margin-top:18px;border-left:2px solid var(--emerald);padding:4px 0 4px 18px}
  .mission-block .mission-label{margin:0 0 4px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--emerald);font-weight:700}
  .mission-block .mission-text{margin:0;font-family:var(--body);font-size:13.5px;line-height:1.55;color:var(--soft)}
  .cover-art{display:grid;place-items:center;position:relative}
  .cover-art .halo{position:absolute;width:min(100%,430px);aspect-ratio:1;border-radius:50%;
    border:1px solid rgba(166,132,26,.14);
    box-shadow:0 0 60px rgba(166,132,26,.08) inset;
    animation:haloSpin 60s linear infinite}
  .cover-art .halo.two{width:min(80%,344px);border-color:rgba(16,24,40,.06);animation-duration:80s;animation-direction:reverse}
  @keyframes haloSpin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.cover-art .halo{animation:none}}
  .cover-art img{position:relative;width:min(76%,312px);height:auto;filter:drop-shadow(0 20px 46px rgba(16,24,40,.16))}

  /* ---- Cards ---- */
  .card{position:relative;background:var(--surface);border:1px solid var(--edge);border-radius:var(--r-xl);
    box-shadow:var(--shadow-sm);padding:clamp(15px,1.7vw,22px);transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease)}
  .card:hover{transform:translateY(-4px) scale(1.015);box-shadow:var(--shadow-md);border-color:var(--edge-2)}
  .card-title{font-family:var(--display);font-size:clamp(17px,1.8vw,21px);font-weight:700;color:var(--ink);margin:0;line-height:1.25;letter-spacing:-.008em}
  .card-sub{font-size:11.5px;color:var(--muted);margin:4px 0 0}
  .card-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--soft);margin:0 0 8px}

  .grid{display:grid;gap:clamp(12px,1.4vw,18px)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .grid > *{opacity:0;transform:translateY(10px);animation:cardIn .5s var(--ease) forwards}
  .grid > *:nth-child(1){animation-delay:.02s} .grid > *:nth-child(2){animation-delay:.06s}
  .grid > *:nth-child(3){animation-delay:.1s} .grid > *:nth-child(4){animation-delay:.14s}
  .grid > *:nth-child(5){animation-delay:.18s} .grid > *:nth-child(6){animation-delay:.22s}
  .grid > *:nth-child(7){animation-delay:.26s} .grid > *:nth-child(8){animation-delay:.3s}
  .grid > *:nth-child(n+9){animation-delay:.32s}
  @keyframes cardIn{to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){.grid > *{animation:none;opacity:1;transform:none}}

  /* ---- Name chips: floating mini profile pills ---- */
  .names{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:clamp(11.5px,1.1vw,13.5px);font-weight:500;
    color:var(--ink);background:var(--bg-2);border:1px solid var(--edge);padding:7px 13px;border-radius:99px;max-width:100%;
    transition:background .2s var(--ease),transform .2s var(--ease-spring),box-shadow .2s var(--ease)}
  .chip:hover{background:var(--surface);box-shadow:var(--shadow-xs);transform:translateY(-1px)}
  .chip .x{display:none}
  .chip.person-chip{padding-left:4px;gap:7px;cursor:pointer}
  .chip-avatar{width:24px;height:24px;border-radius:50%;overflow:hidden;flex:0 0 auto;display:grid;place-items:center;
    background:var(--edge-2);color:var(--soft);font-size:10px;font-weight:700;cursor:default;transition:box-shadow .15s}
  .chip-avatar img{width:100%;height:100%;object-fit:cover}
  .chip-avatar .initial{text-transform:uppercase}
  body.editing .chip-avatar{cursor:pointer}
  body.editing .chip-avatar:hover{box-shadow:0 0 0 2px var(--gold)}
  .icon{width:clamp(34px,3.4vw,44px);height:clamp(34px,3.4vw,44px);border-radius:var(--r-sm);display:grid;place-items:center;flex:0 0 auto;
    background:var(--bg-2);border:1px solid var(--edge);color:var(--soft);transition:transform .2s var(--ease-spring)}
  .icon svg{width:52%;height:52%}
  .icon.i-gold{background:var(--gold-dim);border-color:rgba(166,132,26,.24);color:var(--gold-2)}
  .icon.i-emerald{background:var(--emerald-dim);border-color:rgba(31,122,77,.22);color:var(--emerald)}

  /* ---- Editing ---- */
  .ed{outline:none;border-radius:5px;min-width:14px;display:inline-block}
  body.editing .ed{box-shadow:inset 0 -1px 0 var(--edge-2);cursor:text}
  body.editing .ed:hover{box-shadow:inset 0 -1px 0 var(--gold)}
  .ed:focus{background:var(--gold-dim);box-shadow:0 0 0 2px var(--gold) !important;color:var(--ink)}
  .chip .x{width:16px;height:16px;border:none;border-radius:50%;background:var(--edge-2);color:var(--soft);font-size:11px;line-height:1;cursor:pointer;padding:0;place-items:center;flex:0 0 auto}
  .chip .x:hover{background:var(--danger);color:#fff}
  body.editing .chip .x{display:grid}
  .add{display:none;align-items:center;gap:6px;border:1px dashed var(--edge-2);background:transparent;color:var(--soft);
    font-family:var(--body);font-size:11.5px;font-weight:600;padding:7px 13px;border-radius:99px;cursor:pointer;
    transition:border-color .2s var(--ease),color .2s var(--ease),background .2s var(--ease),transform .18s var(--ease-spring)}
  .add:hover{border-color:var(--gold);color:var(--gold-2);background:var(--gold-dim);transform:scale(1.03)}
  body.editing .add{display:inline-flex}
  .card-del{display:none;position:absolute;top:10px;right:10px;width:24px;height:24px;border:1px solid var(--edge-2);
    background:var(--glass-2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--soft);border-radius:50%;font-size:12px;line-height:1;cursor:pointer;place-items:center;z-index:2;box-shadow:var(--shadow-xs);
    transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease-spring)}
  .card-del:hover{background:var(--danger);color:#fff;border-color:var(--danger);transform:scale(1.08)}
  body.editing .card-del{display:grid}
  .drag-handle{display:none;position:absolute;top:10px;left:10px;width:24px;height:24px;border:1px solid var(--edge-2);
    background:var(--glass-2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--soft);border-radius:50%;cursor:grab;place-items:center;z-index:2;padding:0;box-shadow:var(--shadow-xs)}
  .drag-handle:hover{color:var(--gold-2);border-color:var(--gold)}
  .drag-handle:active{cursor:grabbing}
  .drag-handle svg{width:13px;height:13px}
  body.editing .drag-handle{display:grid}
  [data-drag-list].dragging{opacity:.4}
  [data-drag-list].drag-over{outline:2px dashed var(--gold);outline-offset:3px;border-radius:var(--r-lg)}
  .add-card{display:none;align-items:center;justify-content:center;gap:8px;min-height:96px;border:1.5px dashed var(--edge-2);
    border-radius:var(--r-xl);background:transparent;color:var(--muted);font-family:var(--body);font-size:12px;font-weight:600;
    letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:border-color .22s var(--ease),color .22s var(--ease),background .22s var(--ease),transform .22s var(--ease-spring)}
  .add-card:hover{border-color:var(--gold);color:var(--gold-2);background:var(--gold-dim);transform:translateY(-2px)}
  body.editing .add-card{display:flex}
  .edit-hint{display:none;margin:0 0 16px;font-size:11.5px;color:var(--soft);background:var(--glass-2);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid var(--glass-border);border-radius:var(--r-md);padding:10px 14px;box-shadow:var(--shadow-xs)}
  body.editing .edit-hint{display:block}

  /* ---- Hierarchy ---- */
  .chain{display:grid;justify-items:center}
  .tier{width:100%;max-width:900px;opacity:0;transform:translateY(12px);animation:cardIn .5s var(--ease) forwards}
  .tier:nth-child(1){animation-delay:.02s} .tier:nth-child(3){animation-delay:.1s}
  .tier:nth-child(5){animation-delay:.18s} .tier:nth-child(7){animation-delay:.26s}
  @media (prefers-reduced-motion:reduce){.tier{animation:none;opacity:1;transform:none}}
  .tier-card{position:relative;background:var(--surface);border:1px solid var(--edge);border-radius:var(--r-xl);
    box-shadow:var(--shadow-sm);padding:clamp(15px,1.8vw,24px) clamp(17px,2.1vw,30px);
    display:grid;grid-template-columns:auto 1fr;gap:clamp(12px,2vw,26px);align-items:center;overflow:hidden;
    transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
  .tier-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px)}
  .tier-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--navy)}
  .tier-card.t-gold::before{background:var(--gold)}
  .tier-card.t-emerald::before{background:var(--emerald)}
  .tier-meta{min-width:clamp(118px,15vw,190px)}
  .tier-rank{font-family:var(--display);font-size:clamp(15px,1.6vw,19px);font-weight:700;color:var(--ink);margin:0;line-height:1.2}
  .tier-tag{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:5px 0 0}
  .connector{display:grid;justify-items:center;padding:10px 0}
  .connector .line{width:1.5px;height:clamp(14px,2.4vh,26px);background:linear-gradient(var(--edge-2),var(--gold))}
  .connector .node{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(166,132,26,.12);margin:5px 0}
  .connector .line.tail{background:linear-gradient(var(--gold),var(--edge-2))}

  /* ---- Ministry cards ---- */
  .ministry{display:flex;flex-direction:column;gap:10px}
  .ministry .m-name{font-size:clamp(14.5px,1.5vw,18px);font-weight:700;color:var(--ink);margin:0;line-height:1.25;letter-spacing:-.005em}
  .ministry .abbr{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:3px 0 0}
  .headline{margin-top:auto;padding-top:11px;border-top:1px solid var(--edge)}
  .headline .role{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);font-weight:700;margin:0 0 3px}
  .headline .person{font-size:clamp(12.5px,1.35vw,15px);font-weight:600;color:var(--ink);margin:0;cursor:pointer;transition:color .18s var(--ease)}
  .headline .person:hover{color:var(--gold-2)}

  /* ---- Assistants ---- */
  .assist{display:grid;grid-template-columns:auto 1fr;gap:clamp(13px,2vw,22px);align-items:start}
  .avatar{width:clamp(46px,4.4vw,58px);height:clamp(46px,4.4vw,58px);border-radius:var(--r-md);display:grid;place-items:center;
    background:linear-gradient(150deg,#3A3A3E,#1D1D1F);color:#fff;border:1px solid var(--edge-2);
    font-family:var(--display);font-size:clamp(16px,1.8vw,21px);font-weight:700;box-shadow:0 12px 26px rgba(16,24,40,.16);
    transition:transform .25s var(--ease-spring)}
  .card:hover .avatar{transform:scale(1.05)}
  .avatar.a-gold{background:linear-gradient(150deg,#C9A227,#8C6F14);color:#fff;border-color:transparent;box-shadow:0 12px 28px rgba(166,132,26,.22)}
  .duties{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;justify-items:start}
  .duties li{display:flex;align-items:center;gap:9px;font-size:clamp(12px,1.3vw,14.5px);font-weight:500;color:var(--soft)}
  .duties li .dot{width:6px;height:6px;border-radius:50%;background:var(--emerald);flex:0 0 auto}
  .duties .x{width:16px;height:16px;border:none;border-radius:50%;background:var(--edge-2);color:var(--soft);font-size:11px;line-height:1;cursor:pointer;padding:0;display:none;place-items:center}
  body.editing .duties .x{display:grid}
  .duties .x:hover{background:var(--danger);color:#fff}

  /* ---- Statement of Faith (condensed, under the Main Page logo — narrow) ---- */
  .faith-tabs-wrap{width:100%;max-width:340px;margin:26px auto 0}
  .faith-mini-title{margin:0 0 14px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--gold-2);text-align:center}
  .faith-tabbar{position:relative;display:flex;justify-content:center;flex-wrap:wrap;gap:14px;
    border-bottom:1px solid var(--edge);margin:0 auto 16px;padding:0 2px}
  .faith-tab{appearance:none;background:none;border:none;padding:0 1px 9px;font-family:var(--body);font-size:9px;
    letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--soft);cursor:pointer;
    transition:color .2s var(--ease)}
  .faith-tab:hover{color:var(--ink)}
  .faith-tab.is-active{color:var(--gold-2)}
  .faith-tab-indicator{position:absolute;left:0;bottom:-1px;height:2px;background:var(--gold);border-radius:2px;
    transition:transform .32s cubic-bezier(.4,0,.2,1),width .32s cubic-bezier(.4,0,.2,1)}
  .faith-tab-panels{text-align:left}
  .faith-panel{display:none}
  .faith-panel.is-active{display:block;animation:faithFade .35s var(--ease) both}
  @keyframes faithFade{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
  .faith-lede{margin:0;font-size:12px;line-height:1.55;color:var(--soft);text-align:left}
  .faith-belief-list{list-style:none;margin:0;padding:0;display:grid;gap:16px}
  .faith-belief-list li{position:relative;display:flex;align-items:flex-start;gap:9px}
  .faith-belief-check{flex:0 0 auto;width:14px;height:14px;color:var(--muted);margin-top:2px}
  .faith-belief-check svg{width:100%;height:100%}
  .faith-belief-body{flex:1 1 auto;font-size:12px;line-height:1.55;color:var(--soft)}
  .faith-belief-lead{font-weight:700;font-style:italic;color:var(--ink)}
  .faith-belief-list .x{position:absolute;right:0;top:0;width:15px;height:15px;border:none;border-radius:50%;
    background:var(--edge-2);color:var(--soft);font-size:10px;line-height:1;cursor:pointer;padding:0;display:none;place-items:center}
  body.editing .faith-belief-list .x{display:grid}
  .faith-belief-list .x:hover{background:var(--danger);color:#fff}

  /* ---- Departments ---- */
  .dept-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .dept-head .icon{width:32px;height:32px;border-radius:11px}
  .dept-head h4{margin:0;font-size:clamp(12.5px,1.3vw,14.5px);font-weight:700;color:var(--ink)}
  .dept-head .count{margin-left:auto;font-size:10px;font-weight:700;color:var(--gold-2);letter-spacing:.06em;
    background:var(--gold-dim);border-radius:99px;padding:2px 9px}
  .role-block + .role-block{margin-top:12px;padding-top:12px;border-top:1px solid var(--edge)}
  .role-block h5{margin:0 0 7px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);font-weight:700}
  .role-block .lead{margin:0;font-size:clamp(13px,1.4vw,15px);font-weight:600;color:var(--ink)}


  /* ---- Flow ---- */
  .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.3vw,16px)}
  .step{position:relative;background:var(--surface);border:1px solid var(--edge);border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm);padding:clamp(13px,1.5vw,18px);display:flex;flex-direction:column;gap:8px;
    transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
  .step:hover{transform:translateY(-3px) scale(1.015);box-shadow:var(--shadow-md)}
  .step .num{font-size:9.5px;letter-spacing:.14em;font-weight:700;color:var(--gold-2)}
  .step h4{margin:0;font-size:clamp(12.5px,1.3vw,14.5px);font-weight:700;color:var(--ink);line-height:1.3}
  .step p{margin:0;font-size:11.5px;line-height:1.5;color:var(--soft)}
  .step .icon{width:34px;height:34px;border-radius:11px}
  .step .chev{position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--edge-2);width:10px;height:10px}
  .step:nth-child(4n) .chev{display:none}

  .chip-group{display:flex;flex-wrap:wrap;gap:8px}
  .upload-btn{border:1px solid var(--edge-2);border-radius:999px;padding:7px 12px;background:var(--surface);color:var(--soft);font-size:11px;font-weight:700;letter-spacing:.05em;cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),transform .18s var(--ease-spring)}
  .upload-btn:hover{background:var(--gold-dim);color:var(--gold-2);border-color:var(--gold);transform:scale(1.03)}

  /* ---- DGroup + LINKup combined ---- */
  .dgroup-list{display:flex;flex-direction:column;gap:16px}
  .dgroup-block{position:relative;background:var(--surface);border:1px solid var(--edge);border-radius:var(--r-xl);
    box-shadow:var(--shadow-sm);overflow:hidden;transition:box-shadow .3s var(--ease)}
  .dgroup-block.is-open{box-shadow:var(--shadow-md)}
  .dg-summary{padding:clamp(16px,1.9vw,22px) clamp(18px,2.2vw,26px)}
  .dg-note{margin:0;font-size:13px;line-height:1.5;color:var(--soft)}
  .dg-toggle{display:flex;align-items:center;gap:7px;margin-top:14px;border:1px solid var(--edge-2);background:var(--bg-2);
    color:var(--soft);font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:8px 15px;border-radius:99px;cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
  .dg-toggle:hover{color:var(--ink);border-color:var(--gold)}
  .dg-toggle .chev{width:11px;height:11px;transform:rotate(90deg);transition:transform .3s var(--ease)}
  .dgroup-block.is-open .dg-toggle .chev{transform:rotate(-90deg)}
  .dgroup-block.is-open .dg-toggle{color:var(--gold-2);border-color:var(--gold);background:var(--gold-dim)}
  .dg-body{display:none;border-top:1px solid var(--edge);padding:18px clamp(6px,1.6vw,18px) clamp(20px,2.6vw,30px);
    opacity:0;animation:riseIn .4s var(--ease) forwards}
  .dgroup-block.is-open .dg-body{display:block}
  .dg-networks{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .dg-net{min-width:0;border:1px solid var(--edge);border-radius:var(--r-lg);background:var(--bg-2);position:relative;overflow:hidden}

  /* Zoom / pan toolbar for each family-tree network */
  .dg-net-toolbar{position:absolute;top:10px;right:10px;z-index:4;display:flex;align-items:center;gap:2px;
    background:var(--glass-2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--edge);
    border-radius:99px;padding:3px;box-shadow:var(--shadow-xs)}
  .dg-zoom-btn{width:24px;height:24px;border:none;background:transparent;color:var(--soft);border-radius:50%;
    cursor:pointer;display:grid;place-items:center;transition:background .18s var(--ease),color .18s var(--ease)}
  .dg-zoom-btn:hover{background:var(--bg-2);color:var(--ink)}
  .dg-zoom-btn svg{width:12px;height:12px}
  .dg-zoom-pct{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;min-width:30px;text-align:center}
  .ftree-scroll{overflow:auto;padding:26px 4px 10px;cursor:grab;-webkit-user-select:none;user-select:none}
  .ftree-scroll.is-panning{cursor:grabbing}
  .ftree-scroll::-webkit-scrollbar{height:8px;width:8px}
  .ftree-scroll::-webkit-scrollbar-thumb{background:rgba(16,24,40,.14);border-radius:99px}
  .ftree-zoom{transform-origin:top center;transition:transform .22s var(--ease)}
  ul.ftree{display:flex;justify-content:center;min-width:max-content;margin:0 auto;padding:0}
  .ftree ul{display:flex;padding-top:34px;margin:0;position:relative}
  .ftree li{display:flex;flex-direction:column;align-items:center;list-style:none;position:relative;padding:34px 14px 0;flex:0 0 auto}
  .ftree>li{padding-top:0}
  .ftree li::before,.ftree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:34px;border-top:1.5px solid var(--edge-2)}
  .ftree li::after{right:auto;left:50%;border-left:1.5px solid var(--edge-2)}
  .ftree li:only-child{padding-top:0}
  .ftree li:only-child::before,.ftree li:only-child::after{display:none}
  .ftree li:first-child::before,.ftree li:last-child::after{border:0 none}
  .ftree li:last-child::before{border-right:1.5px solid var(--edge-2);border-radius:0 10px 0 0}
  .ftree li:first-child::after{border-radius:10px 0 0 0}
  .ftree>li::before,.ftree>li::after{display:none}
  .ftree li>ul::before{content:"";position:absolute;top:0;left:50%;width:0;height:34px;border-left:1.5px solid var(--edge-2)}
  .ftree li.is-collapsed > ul{display:none}
  .tnode{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
    background:var(--surface);border:1px solid var(--edge);border-radius:var(--r-lg);
    padding:16px 14px 14px;width:clamp(158px,15vw,206px);box-shadow:var(--shadow-sm);
    transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
  .tnode:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);z-index:2}
  .tnode .card-del{top:7px;right:7px;width:20px;height:20px;font-size:10px}
  .tnode-avatar{width:52px;height:52px;border-radius:var(--r-md);display:grid;place-items:center;overflow:hidden;position:relative;
    font-family:var(--display);font-size:16px;font-weight:700;color:#fff;
    background:linear-gradient(150deg,#3A3A3E,#1D1D1F);border:1px solid var(--edge-2)}
  .tnode-avatar img{width:100%;height:100%;object-fit:cover}
  .tnode.t-d0 .tnode-avatar{background:linear-gradient(150deg,#C9A227,#8C6F14)}
  .tnode.t-d1 .tnode-avatar{background:linear-gradient(150deg,#2A9463,#1B6E49)}
  .tnode-dot{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;border:2px solid var(--surface);background:var(--muted)}
  .tnode.t-d0 .tnode-dot{background:var(--gold)}
  .tnode.t-d1 .tnode-dot{background:var(--emerald)}
  .tnode-name{margin:4px 0 0;font-size:12px;font-weight:700;color:var(--ink);text-align:center;line-height:1.3;cursor:pointer}
  .tnode-name:hover{color:var(--gold-2)}
  .tnode-role{margin:0;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
  .tnode-role-pick{margin:1px 0 0;width:auto;max-width:100%;background:var(--gold-dim);border:1px solid rgba(166,132,26,.34);
    color:var(--gold-2);font-family:var(--body);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 7px;border-radius:99px;cursor:pointer}
  .tnode-desc{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--edge);width:100%;
    font-size:10.5px;line-height:1.45;color:var(--soft);text-align:center}
  .tnode-meta{display:flex;align-items:center;gap:5px;margin:5px 0 0;width:100%;font-size:10px;line-height:1.4;
    color:var(--gold-2);text-align:center;justify-content:center}
  .tnode-meta:first-of-type{margin-top:5px}
  .tnode-meta svg{width:11px;height:11px;flex:0 0 auto}
  .tnode-actions{display:none;flex-direction:column;gap:5px;margin-top:8px;width:100%}
  body.editing .tnode-actions{display:flex}
  .tnode-actions .upload-btn,.tnode-actions .add{width:100%;justify-content:center;font-size:9px;padding:5px 6px}
  .tnode-collapse{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;
    background:var(--surface);border:1px solid var(--edge-2);color:var(--soft);display:grid;place-items:center;cursor:pointer;
    z-index:3;box-shadow:var(--shadow-xs);transition:color .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease-spring)}
  .tnode-collapse:hover{color:var(--gold-2);border-color:var(--gold);transform:translateX(-50%) scale(1.08)}
  .tnode-collapse svg{width:10px;height:10px;transition:transform .25s var(--ease)}
  li.is-collapsed > .tnode .tnode-collapse svg{transform:rotate(-90deg)}

  /* ---- Growth Track (New Members workflow) ---- */
  .gt-flow-cta{grid-column:1/-1;display:flex;align-items:center;gap:16px;margin-top:4px;width:100%;text-align:left;
    background:var(--glass-2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border:1px solid rgba(166,132,26,.3);border-radius:var(--r-xl);padding:clamp(15px,2vw,21px) clamp(17px,2.4vw,25px);
    cursor:pointer;transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease);font-family:var(--body);color:inherit}
  .gt-flow-cta:hover{transform:translateY(-3px) scale(1.01);box-shadow:var(--shadow-md);border-color:var(--gold)}
  .gt-flow-cta-icon{flex:0 0 auto;width:48px;height:48px;border-radius:var(--r-md);display:grid;place-items:center;
    background:var(--gold-dim);border:1px solid rgba(166,132,26,.3);color:var(--gold-2)}
  .gt-flow-cta-icon svg{width:52%;height:52%}
  .gt-flow-cta-text{display:flex;flex-direction:column;gap:2px;min-width:0}
  .gt-flow-cta-label{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold-2)}
  .gt-flow-cta-title{font-family:var(--display);font-size:clamp(15px,1.8vw,19px);font-weight:700;color:var(--ink)}
  .gt-flow-cta-sub{font-size:11.5px;color:var(--soft);line-height:1.4}
  .gt-flow-cta-arrow{flex:0 0 auto;width:18px;height:18px;color:var(--gold-2);margin-left:auto}

  .gt-wrap{max-width:840px}
  .gt-intro{margin:0;font-family:var(--display);font-size:clamp(14.5px,1.7vw,19px);line-height:1.55;color:var(--ink);font-style:italic;font-weight:500;max-width:640px}
  .gt-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 18px}
  .gt-tool{border-radius:99px}
  .gt-search{flex:1 1 160px;min-width:0;background:var(--surface);border:1px solid var(--edge-2);color:var(--ink);
    font-family:var(--body);font-size:12px;padding:9px 15px;border-radius:99px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .gt-search::placeholder{color:var(--muted)}
  .gt-search:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}

  .gt-track{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
  .gt-step{position:relative;padding-left:clamp(40px,6vw,54px)}
  .gt-step::before{content:"";position:absolute;left:clamp(17px,2.6vw,23px);top:44px;bottom:-4px;width:1.5px;
    background:linear-gradient(var(--edge-2),var(--edge))}
  .gt-step:last-of-type::before{display:none}
  .gt-step.gt-hidden{display:none}
  .gt-step-head{position:relative;display:flex;align-items:flex-start;gap:12px;padding:14px 0}
  .gt-step-num{position:absolute;left:clamp(-40px,-6vw,-54px);top:14px;width:34px;height:34px;border-radius:50%;flex:0 0 auto;
    background:var(--surface);border:1.5px solid var(--edge-2);color:var(--soft);display:grid;place-items:center;
    font-family:var(--display);font-size:13px;font-weight:700;box-shadow:var(--shadow-sm)}
  .gt-step-icon.icon{width:38px;height:38px;border-radius:var(--r-sm);flex:0 0 auto}
  .gt-step-headline{flex:1 1 auto;min-width:0}
  .gt-step-eyebrow{margin:0 0 3px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold-2)}
  .gt-step-headline h4{margin:0;font-family:var(--display);font-size:clamp(16px,2vw,20px);font-weight:700;color:var(--ink)}
  .gt-step-short{margin:4px 0 0;font-size:12px;line-height:1.45;color:var(--soft)}
  .gt-step .card-del{top:9px;right:9px}
  .gt-step .drag-handle{top:9px;left:auto;right:42px}
  .gt-toggle{flex:0 0 auto;width:30px;height:30px;border-radius:var(--r-sm);border:1px solid var(--edge-2);background:var(--surface);
    color:var(--soft);cursor:pointer;display:grid;place-items:center;align-self:center;margin-top:26px;transition:background .2s var(--ease),border-color .2s var(--ease),transform .2s var(--ease-spring)}
  .gt-toggle:hover{transform:scale(1.06)}
  .gt-toggle:hover{color:var(--gold-2);border-color:var(--gold);background:var(--gold-dim)}
  .gt-toggle .chev{width:11px;height:11px;transform:rotate(90deg);transition:transform .3s var(--ease)}
  .gt-step.is-open .gt-toggle .chev{transform:rotate(-90deg)}
  .gt-step.is-open .gt-toggle{color:var(--gold-2);border-color:var(--gold);background:var(--gold-dim)}
  .gt-step-body{display:none;margin:0 0 20px;padding:18px clamp(15px,2vw,23px) clamp(19px,2.2vw,23px);
    background:var(--surface);border:1px solid var(--edge);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);
    flex-direction:column;gap:14px;opacity:0;animation:riseIn .35s var(--ease) forwards}
  .gt-step.is-open .gt-step-body{display:flex}
  .gt-field-label{margin:0 0 5px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold-2)}
  .gt-field-text{margin:0;font-size:13px;line-height:1.55;color:var(--soft)}
  .gt-list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
  .gt-list li{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.45;color:var(--soft)}
  .gt-check{flex:0 0 auto;width:16px;height:16px;border-radius:50%;background:var(--emerald-dim);color:var(--emerald);
    display:grid;place-items:center;margin-top:1px}
  .gt-check svg{width:10px;height:10px}
  .gt-extras{display:flex;flex-direction:column;gap:6px}
  .gt-extra{display:flex;align-items:center;gap:8px;font-size:12px;background:var(--bg-2);
    border:1px solid var(--edge);border-radius:var(--r-sm);padding:8px 11px}
  .gt-extra-label{font-weight:700;color:var(--gold-2);letter-spacing:.03em}
  .gt-extra-value{color:var(--soft)}
  .gt-next{display:flex;align-items:center;gap:9px;padding-top:10px;border-top:1px solid var(--edge);font-size:11.5px}
  .gt-next-label{letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
  .gt-next-value{font-weight:700;color:var(--ink)}
  .gt-next svg{width:13px;height:13px;color:var(--gold-2);margin-left:auto}

  .gt-complete{position:relative;margin-top:16px;text-align:center;padding:clamp(30px,4vw,44px) clamp(20px,3vw,34px);
    border-radius:var(--r-2xl);background:var(--glass-2);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
    border:1px solid var(--glass-border);box-shadow:var(--shadow-lg);overflow:hidden}
  .gt-complete-badge{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;margin-bottom:14px;
    background:var(--gold-dim);border:1px solid rgba(166,132,26,.3);color:var(--gold-2)}
  .gt-complete-badge svg{width:52%;height:52%}
  .gt-complete h3{margin:0 0 8px;font-family:var(--display);font-size:clamp(22px,3vw,30px);font-weight:800;color:var(--ink)}
  .gt-complete p{margin:0 auto;max-width:480px;font-size:13px;line-height:1.6;color:var(--soft)}
  .gt-cta{margin-top:20px;display:inline-flex;align-items:center;gap:9px;background:var(--gold-dim);color:var(--gold-2);
    border:1px solid rgba(166,132,26,.34);border-radius:99px;padding:10px 20px;font-family:var(--body);font-size:12px;font-weight:700;
    letter-spacing:.04em}
  .gt-cta svg{width:14px;height:14px}

  @media (max-width:560px){
    .gt-step{padding-left:38px}
    .gt-step::before{left:16px}
    .gt-step-num{left:-38px;width:30px;height:30px}
    .gt-search{flex-basis:100%}
  }

  /* ---- Closing ---- */
  .closing{text-align:center;display:grid;justify-items:center}
  .closing img.seal{width:min(124px,26vw);height:auto;margin-bottom:16px;filter:drop-shadow(0 10px 30px rgba(16,24,40,.14))}
  .closing blockquote{margin:0;max-width:900px;font-family:var(--display);font-size:clamp(20px,3.2vw,38px);line-height:1.34;color:var(--ink);font-weight:600}
  .closing .ref{margin:20px 0 0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-2);font-weight:700}
  .closing .divider{width:120px;height:1px;background:linear-gradient(90deg,rgba(166,132,26,0),var(--gold),rgba(166,132,26,0));margin:26px 0 18px}
  .closing .footer-name{font-size:clamp(12px,1.4vw,15px);font-weight:700;color:var(--ink);letter-spacing:.03em;margin:0}
  .closing .footer-sub{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;font-weight:500}

  /* ==================================================================
     Sidebar navigation — a floating glass rail on desktop/tablet that
     replaces the old bottom pill bar. Below 820px it collapses back to
     a compact floating capsule pinned to the bottom (thumb reach), and
     the same markup/JS drives both — only position/orientation changes.
  ================================================================== */
  .sidebar{flex:0 0 auto;width:var(--sidebar-w);padding:18px 14px;display:flex;flex-direction:column;gap:4px;
    position:relative;z-index:4;transition:width .3s var(--ease)}
  .sidebar-scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:2px;
    scrollbar-width:none;-ms-overflow-style:none}
  .sidebar-scroll::-webkit-scrollbar{display:none}
  .sidebar-panel{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(1.5);backdrop-filter:blur(28px) saturate(1.5);
    border:1px solid var(--glass-border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);padding:8px;
    display:flex;flex-direction:column;gap:2px;height:100%}
  .navitem{position:relative;display:flex;align-items:center;gap:11px;border:none;background:transparent;color:var(--soft);
    font-family:var(--body);font-size:12.5px;font-weight:600;text-align:left;padding:10px 12px;border-radius:14px;
    cursor:pointer;white-space:nowrap;overflow:hidden;transition:color .22s var(--ease)}
  .navitem:hover{color:var(--ink)}
  .navitem .ni-icon{flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;color:inherit}
  .navitem .ni-icon svg{width:100%;height:100%}
  .navitem .ni-label{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
  .navitem.is-active{color:var(--ink);font-weight:700}
  .nav-indicator{position:absolute;top:0;left:0;border-radius:14px;background:var(--glass-2);
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset,var(--shadow-xs),0 0 0 1px var(--gold-dim);
    transition:transform .4s var(--ease),width .4s var(--ease),height .4s var(--ease),opacity .2s;
    z-index:0;pointer-events:none;will-change:transform}
  .sidebar-foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px 2px}
  .sidebar-collapse{width:26px;height:26px;border-radius:50%;border:1px solid var(--edge-2);background:var(--surface);
    color:var(--soft);cursor:pointer;display:grid;place-items:center;transition:background .18s var(--ease),transform .3s var(--ease)}
  .sidebar-collapse svg{width:11px;height:11px;transition:transform .3s var(--ease)}
  .sidebar-collapse:hover{background:var(--bg-2);color:var(--ink)}
  body.sidebar-collapsed .sidebar{width:var(--sidebar-w-rail)}
  body.sidebar-collapsed .navitem .ni-label,body.sidebar-collapsed .counter-mini{display:none}
  body.sidebar-collapsed .navitem{justify-content:center;padding:10px}
  body.sidebar-collapsed .sidebar-collapse svg{transform:rotate(180deg)}
  .counter-mini{font-size:10px;color:var(--muted);letter-spacing:.06em;font-weight:600}

  /* mobile prev/next, hidden on desktop */
  .mobile-nav{display:none}
  .btn{width:32px;height:32px;border-radius:99px;border:none;background:transparent;color:var(--soft);cursor:pointer;
    display:grid;place-items:center;transition:background .2s var(--ease),color .2s var(--ease),transform .18s var(--ease-spring)}
  .btn:hover:not(:disabled){background:var(--bg-2);color:var(--ink);transform:scale(1.06)}
  .btn:disabled{opacity:.28;cursor:default}
  .btn svg{width:15px;height:15px}
  .btn:focus-visible,.navitem:focus-visible,.tool:focus-visible,.pill:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .slide-name{display:none}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);background:var(--ink);color:#fff;
    font-size:12px;font-weight:600;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;
    box-shadow:var(--shadow-lg);transition:opacity .3s var(--ease),transform .3s var(--ease);z-index:80}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---- Responsive ---- */
  @media (max-width:1024px){
    .g4{grid-template-columns:repeat(2,1fr)}
    .flow{grid-template-columns:repeat(2,1fr)}
    .step .chev{display:none}
    :root{--sidebar-w:208px}
  }
  @media (max-width:900px){
    .search-trigger{max-width:220px}
  }
  @media (max-width:820px){
    .cover{grid-template-columns:1fr;gap:18px}
    .cover-art{order:-1}
    .cover-art img{width:min(48%,190px)}
    .cover-art .halo{display:none}
    .g3,.g2{grid-template-columns:1fr}
    .dg-networks{grid-template-columns:1fr}
    .tier-card{grid-template-columns:1fr;gap:11px}
    .slide{justify-content:flex-start;padding-top:20px;padding-bottom:96px}
    .mark .name{display:none}
    .search-trigger{display:none}

    /* Sidebar collapses into a floating bottom capsule with the same nav items */
    .app-body{flex-direction:column}
    .sidebar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:auto;max-width:96vw;padding:0;z-index:30}
    .sidebar-panel{flex-direction:row;align-items:center;padding:5px;border-radius:99px;gap:0;height:auto}
    .sidebar-scroll{flex-direction:row;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth}
    .navitem{flex:0 0 auto;flex-direction:column;gap:4px;padding:8px 6px;border-radius:16px;font-size:9px;width:60px}
    .navitem .ni-icon{width:18px;height:18px}
    .navitem .ni-label{width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .nav-indicator{border-radius:16px}
    .sidebar-foot{display:none}
    .mobile-nav{display:flex;align-items:center;gap:2px;order:-1;padding-right:4px;margin-right:2px;border-right:1px solid var(--edge)}
    body.sidebar-collapsed .sidebar{width:auto}
    body.sidebar-collapsed .navitem .ni-label{display:block}
  }
  @media (max-width:560px){
    .g4{grid-template-columns:1fr}
    .flow{grid-template-columns:1fr}
    .counter{display:none}
    .tool{padding:8px 10px;font-size:10px}
    .countdown{padding:20px 12px 18px}
    .countdown-grid{gap:8px;max-width:340px}
    .countdown-tag{font-size:7.2px;letter-spacing:.1em}
    .navitem{padding:7px 9px}
    .btn{width:30px;height:30px}
    .stat-row{grid-template-columns:repeat(2,1fr)}
    .profile-sheet{width:100vw}
  }
  @media (prefers-reduced-motion:reduce){
    .slide{transition:none}
    .card:hover,.tier-card:hover,.step:hover,.tnode:hover{transform:none}
    .countdown,.flip-tile,.countdown-num.tick,.countdown .spark{animation:none;opacity:1;transform:none}
    .nav-indicator,.ftree-zoom{transition:none}
    .eyebrow,h2.title,.subtitle,.grid > *,.tier,.gt-step-body,.dg-body{animation:none;opacity:1;transform:none}
  }

  /* ---- Sign-in modal ---- */
  .auth-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(20,20,22,.44);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    animation:fadeIn .25s var(--ease)}
  .auth-wrap[hidden]{display:none}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .auth-box{width:min(380px,90vw);background:var(--glass-2);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);
    border:1px solid var(--glass-border);border-radius:var(--r-2xl);padding:28px;box-shadow:var(--shadow-lg);
    animation:sheetIn .3s var(--ease-spring)}
  @keyframes sheetIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  .auth-box h3{margin:0 0 6px;font-family:var(--display);font-size:22px;color:var(--ink);font-weight:700}
  .auth-box p{margin:0 0 18px;font-size:12px;color:var(--soft);line-height:1.5}
  .auth-box label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:12px}
  .auth-box input{display:block;width:100%;margin-top:7px;padding:11px 14px;border-radius:var(--r-sm);border:1px solid var(--edge-2);
    background:var(--surface);color:var(--ink);font-family:var(--body);font-size:14px;letter-spacing:0;text-transform:none;
    transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .auth-box input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
  .auth-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
  .auth-err{color:var(--danger);font-size:12px;margin:12px 0 0;min-height:16px}

  /* ---- Icon picker ---- */
  .icon-box{width:min(400px,90vw)}
  .icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
  .icon-opt{width:100%;aspect-ratio:1;border-radius:var(--r-sm);border:1px solid var(--edge-2);background:var(--bg-2);
    color:var(--soft);display:grid;place-items:center;cursor:pointer;transition:background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),transform .18s var(--ease-spring)}
  .icon-opt svg{width:46%;height:46%}
  .icon-opt:hover{background:var(--edge);color:var(--ink);transform:scale(1.06)}
  .icon-opt.is-active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold-2)}
  .tone-row{display:flex;gap:10px;align-items:center}
  .tone-opt{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;padding:0;
    box-shadow:0 0 0 1px var(--edge-2);transition:transform .18s var(--ease-spring)}
  .tone-opt:hover{transform:scale(1.1)}
  .tone-opt.t-def{background:linear-gradient(150deg,#3A3A3E,#1D1D1F)}
  .tone-opt.t-gold{background:linear-gradient(150deg,#C9A227,#8C6F14)}
  .tone-opt.t-emerald{background:linear-gradient(150deg,#2A9463,#1B6E49)}
  .tone-opt.is-active{border-color:var(--ink);box-shadow:0 0 0 1px var(--edge-2),0 0 0 3px rgba(0,0,0,.1)}
  button.icon-pick{cursor:pointer;padding:0;font:inherit;position:relative}
  body.editing button.icon-pick:hover{box-shadow:0 0 0 2px var(--gold)}

  /* ---- Ambient background picker ---- */
  .amb-row{margin-top:18px;padding-top:16px;border-top:1px solid var(--edge)}
  .amb-label{margin:0 0 10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700}
  .amb-swatches{display:flex;gap:10px}
  .amb-swatch{width:56px;height:40px;border-radius:var(--r-sm);border:2px solid transparent;cursor:pointer;padding:0;
    box-shadow:0 0 0 1px var(--edge-2);position:relative;transition:transform .2s var(--ease-spring),box-shadow .2s var(--ease)}
  .amb-swatch:hover{transform:translateY(-2px)}
  .amb-swatch.is-active{border-color:var(--gold);box-shadow:0 0 0 1px var(--edge-2),0 0 0 3px rgba(166,132,26,.2)}
  .amb-check{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:#fff;
    display:none;place-items:center;color:var(--gold-2);box-shadow:0 1px 3px rgba(16,24,40,.22)}
  .amb-swatch.is-active .amb-check{display:grid}
  .amb-check svg{width:9px;height:9px}

  /* ==================================================================
     Spotlight search (Cmd/Ctrl+K)
  ================================================================== */
  .spotlight-wrap{position:fixed;inset:0;z-index:70;display:grid;align-content:start;justify-items:center;
    padding-top:min(14vh,140px);background:rgba(20,20,22,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    animation:fadeIn .2s var(--ease)}
  .spotlight-wrap[hidden]{display:none}
  .spotlight{width:min(560px,92vw);max-height:min(64vh,520px);display:flex;flex-direction:column;
    background:var(--glass-2);-webkit-backdrop-filter:blur(34px) saturate(1.6);backdrop-filter:blur(34px) saturate(1.6);
    border:1px solid var(--glass-border);border-radius:var(--r-2xl);box-shadow:var(--shadow-lg);overflow:hidden;
    animation:sheetIn .28s var(--ease-spring)}
  .spotlight-field{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--edge)}
  .spotlight-field svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}
  .spotlight-input{flex:1 1 auto;border:none;background:transparent;outline:none;font-family:var(--body);
    font-size:16px;color:var(--ink);min-width:0}
  .spotlight-input::placeholder{color:var(--muted)}
  .spotlight-esc{flex:0 0 auto;font-size:10px;font-weight:700;color:var(--soft);background:var(--bg-2);
    border:1px solid var(--edge-2);border-radius:6px;padding:3px 7px}
  .spotlight-results{overflow-y:auto;padding:8px}
  .spotlight-empty{padding:34px 16px;text-align:center;font-size:13px;color:var(--muted)}
  .spotlight-group-label{margin:10px 12px 4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
  .spotlight-item{display:flex;align-items:center;gap:12px;width:100%;border:none;background:transparent;text-align:left;
    padding:10px 12px;border-radius:var(--r-md);cursor:pointer;font-family:var(--body);color:var(--ink);transition:background .15s}
  .spotlight-item .si-icon{flex:0 0 auto;width:32px;height:32px;border-radius:10px;background:var(--bg-2);
    display:grid;place-items:center;color:var(--soft)}
  .spotlight-item .si-icon svg{width:50%;height:50%}
  .spotlight-item .si-text{min-width:0;flex:1 1 auto}
  .spotlight-item .si-title{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spotlight-item .si-sub{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spotlight-item .si-arrow{flex:0 0 auto;width:13px;height:13px;color:var(--muted);opacity:0;transition:opacity .15s,transform .15s}
  .spotlight-item.is-active{background:var(--gold-dim)}
  .spotlight-item.is-active .si-icon{background:var(--surface);color:var(--gold-2)}
  .spotlight-item.is-active .si-arrow{opacity:1;transform:translateX(2px)}
  mark{background:var(--gold-dim);color:var(--gold-2);border-radius:3px;padding:0 1px;font-weight:700}

  /* ==================================================================
     Filter chips (Ministry Leadership)
  ================================================================== */
  .filter-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
  .filter-chip{border:1px solid var(--edge-2);background:var(--surface);color:var(--soft);font-family:var(--body);
    font-size:12px;font-weight:600;padding:8px 15px;border-radius:99px;cursor:pointer;
    transition:background .22s var(--ease),color .22s var(--ease),border-color .22s var(--ease),transform .18s var(--ease-spring)}
  .filter-chip:hover{border-color:var(--edge-2);background:var(--bg-2);color:var(--ink);transform:translateY(-1px)}
  .filter-chip.is-active{background:var(--ink);border-color:var(--ink);color:#fff}
  .ministry.is-filtered-out{display:none !important}

  /* ==================================================================
     Profile side-sheet
  ================================================================== */
  .profile-wrap{position:fixed;inset:0;z-index:65;pointer-events:none}
  .profile-wrap[hidden]{display:none}
  .profile-scrim{position:absolute;inset:0;background:rgba(20,20,22,.36);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    opacity:0;transition:opacity .3s var(--ease);pointer-events:none}
  .profile-wrap.is-open .profile-scrim{opacity:1;pointer-events:auto}
  .profile-sheet{position:absolute;top:0;right:0;bottom:0;width:min(400px,92vw);
    background:var(--glass-2);-webkit-backdrop-filter:blur(34px) saturate(1.6);backdrop-filter:blur(34px) saturate(1.6);
    border-left:1px solid var(--glass-border);box-shadow:var(--shadow-lg);
    transform:translateX(100%);transition:transform .38s var(--ease);pointer-events:auto;
    display:flex;flex-direction:column;overflow-y:auto}
  .profile-wrap.is-open .profile-sheet{transform:translateX(0)}
  .profile-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;border:1px solid var(--edge-2);
    background:var(--surface);color:var(--soft);cursor:pointer;display:grid;place-items:center;z-index:2;
    transition:background .18s var(--ease),transform .18s var(--ease-spring)}
  .profile-close:hover{background:var(--bg-2);color:var(--ink);transform:scale(1.06)}
  .profile-close svg{width:13px;height:13px}
  .profile-hero{padding:44px 26px 22px;text-align:center;border-bottom:1px solid var(--edge)}
  .profile-avatar{width:88px;height:88px;border-radius:28px;margin:0 auto 16px;overflow:hidden;position:relative;
    display:grid;place-items:center;font-family:var(--display);font-size:30px;font-weight:700;color:#fff;
    background:linear-gradient(150deg,#3A3A3E,#1D1D1F);box-shadow:var(--shadow-md)}
  .profile-avatar img{width:100%;height:100%;object-fit:cover}
  .profile-avatar-dot{position:absolute;right:2px;bottom:2px;width:16px;height:16px;border-radius:50%;background:var(--gold);border:3px solid var(--surface)}
  .profile-name{margin:0;font-family:var(--display);font-size:21px;font-weight:700;color:var(--ink)}
  .profile-role{margin:5px 0 0;font-size:12px;color:var(--gold-2);font-weight:600;letter-spacing:.02em}
  .profile-body{padding:22px 26px 30px;display:flex;flex-direction:column;gap:20px}
  .profile-section-label{margin:0 0 9px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
  .profile-roles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .profile-role-row{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--edge);
    border-radius:var(--r-md);padding:11px 13px}
  .profile-role-row .icon{width:30px;height:30px;border-radius:9px;flex:0 0 auto}
  .profile-role-row .pr-text{min-width:0;display:flex;flex-direction:column;gap:1px}
  .profile-role-row .pr-title{display:block;font-size:12.5px;font-weight:600;color:var(--ink)}
  .profile-role-row .pr-sub{display:block;font-size:10.5px;color:var(--muted)}
  .profile-meta-list{list-style:none;margin:0;padding:0;display:grid;gap:9px}
  .profile-meta-list li{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--soft);line-height:1.5}
  .profile-meta-list svg{width:13px;height:13px;flex:0 0 auto;margin-top:2px;color:var(--gold-2)}
  .profile-empty{font-size:12px;color:var(--muted);font-style:italic}

  /* ---- Print: the light theme already matches print-friendly colors,
     so this only needs to strip UI chrome and force static page flow ---- */
  @media print{
    @page{size:landscape;margin:12mm}
    html,body{overflow:visible !important;height:auto !important;background:#fff !important}
    /* Printed output always stays light/legible, even when browsing in the navy theme */
    body.theme-navy{
      --ink:#1D1D1F !important; --soft:#6E6E73 !important; --muted:#8E8E93 !important;
      --surface:#FFFFFF !important; --glass:rgba(255,255,255,.62) !important; --glass-2:rgba(255,255,255,.94) !important;
      --glass-border:rgba(255,255,255,.55) !important; --edge:rgba(60,60,67,.09) !important; --edge-2:rgba(60,60,67,.15) !important;
    }
    .ambient,.sidebar,.topbar,.toast,.add,.add-card,.card-del,.drag-handle,.edit-hint,.chip .x,.duties .x,.faith-belief-list .x,.step .chev,.dg-toggle,.countdown-edit-label,.countdown .spark,.gt-toolbar,.gt-toggle,.gt-flow-cta-arrow,.spotlight-wrap,.profile-wrap,.filter-chips,.dg-net-toolbar,.tnode-collapse{display:none !important}
    .app-body{display:block !important}
    .dg-body{display:block !important}
    .gt-step-body{display:flex !important}
    .gt-step::before{display:none !important}
    .deck{position:static !important}
    .stage{overflow:visible !important}
    .slide{position:static !important;opacity:1 !important;visibility:visible !important;transform:none !important;
      page-break-after:always;break-after:page;min-height:auto;padding:0 0 14mm !important;display:block !important}
    .slide:last-child{page-break-after:auto}
    .inner{max-width:100% !important}
    .card,.tier-card,.step,.dgroup-block,.tnode,.dg-net,.gt-step-body,.gt-complete{box-shadow:none !important;break-inside:avoid}
    .countdown,.flip-tile{animation:none !important;opacity:1 !important;transform:none !important;box-shadow:none !important}
    .countdown-num.tick{animation:none !important}
    .connector .node,.avatar,.badge{box-shadow:none !important}
    .closing img.seal,.cover-art img{filter:none !important}
    .cover{grid-template-columns:1.1fr .9fr !important}
    .dg-networks{grid-template-columns:1fr 1fr !important}
    .ftree-scroll{overflow:visible !important}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }

<script>
/* ---------------------------------------------------------------------
   Ambient liquid background — a small self-contained WebGL "warp" shader
   (navy / gold / blue), independent of the rest of the app. Never throws:
   if WebGL isn't available, the canvas just stays blank and the static
   .ambient gradient underneath carries the page.
--------------------------------------------------------------------- */
(function(){
  try{
    var canvas = document.getElementById("liquidBg");
    if (!canvas || !canvas.getContext) return;
    var gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    if (!gl) return;

    var vsSrc = "attribute vec2 aPos;void main(){gl_Position=vec4(aPos,0.0,1.0);}";
    var fsSrc = [
      "precision highp float;",
      "uniform vec2 uRes;",
      "uniform float uTime;",
      "uniform vec3 uNavy;",
      "uniform vec3 uGold;",
      "uniform vec3 uBlue;",
      "float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}",
      "float noise(vec2 p){vec2 i=floor(p),f=fract(p);",
      "float a=hash(i),b=hash(i+vec2(1.0,0.0)),c=hash(i+vec2(0.0,1.0)),d=hash(i+vec2(1.0,1.0));",
      "vec2 u=f*f*(3.0-2.0*f);",
      "return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;}",
      "float fbm(vec2 p){float v=0.0,amp=0.5;for(int i=0;i<5;i++){v+=amp*noise(p);p*=2.02;amp*=0.5;}return v;}",
      "void main(){",
      "vec2 uv=gl_FragCoord.xy/uRes.xy;",
      "float aspect=uRes.x/uRes.y;",
      "vec2 p=vec2(uv.x*aspect,uv.y)*2.2;",
      "float t=uTime*0.035;",
      "vec2 warp=vec2(fbm(p+t),fbm(p-t+4.7));",
      "float n=fbm(p+warp*1.6+t*0.6);",
      "float n2=fbm(p*1.3-warp*1.2-t*0.4+9.1);",
      "vec3 col=mix(uBlue,uNavy,smoothstep(0.2,0.75,n));",
      "col=mix(col,uGold,smoothstep(0.55,0.95,n2)*0.55);",
      "gl_FragColor=vec4(col,1.0);",
      "}"
    ].join("\n");

    function compile(type, src){
      var s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }
    var prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);

    var quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    var aPos = gl.getAttribLocation(prog, "aPos");
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    var uRes = gl.getUniformLocation(prog, "uRes");
    var uTime = gl.getUniformLocation(prog, "uTime");
    function hexToVec3(hex){
      hex = hex.replace("#","");
      var n = parseInt(hex,16);
      return [((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255];
    }
    var uNavyLoc = gl.getUniformLocation(prog, "uNavy");
    var uGoldLoc = gl.getUniformLocation(prog, "uGold");
    var uBlueLoc = gl.getUniformLocation(prog, "uBlue");
    function setPalette(hexArr){
      gl.uniform3fv(uNavyLoc, hexToVec3(hexArr[0]));
      gl.uniform3fv(uGoldLoc, hexToVec3(hexArr[1]));
      gl.uniform3fv(uBlueLoc, hexToVec3(hexArr[2]));
      if (reduceMotion) gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    setPalette(["#1E3A5F", "#A6841A", "#4A7FC7"]);
    window.__liquidBgSetPalette = setPalette;

    var dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    function resize(){
      var w = Math.floor(window.innerWidth * dpr), h = Math.floor(window.innerHeight * dpr);
      if (canvas.width !== w || canvas.height !== h){
        canvas.width = w; canvas.height = h;
        gl.viewport(0, 0, w, h);
        gl.uniform2f(uRes, w, h);
      }
    }
    resize();
    window.addEventListener("resize", resize);

    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var rafId = null, startTime = performance.now(), pausedAt = 0;
    function frame(now){
      gl.uniform1f(uTime, (now - startTime) / 1000);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      if (!reduceMotion) rafId = requestAnimationFrame(frame);
    }
    frame(performance.now());

    document.addEventListener("visibilitychange", function(){
      if (reduceMotion) return;
      if (document.hidden){
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
        pausedAt = performance.now();
      } else if (!rafId){
        startTime += performance.now() - pausedAt;
        rafId = requestAnimationFrame(frame);
      }
    });
  } catch(e){ /* WebGL unsupported or failed — static .ambient gradient carries the page */ }
})();
</script>

  function migrateDgroups(saved){

    if (savedDgroups){

        if (Array.isArray(g.networks)){
          nets = g.networks.map(function(n){ return n && n.root ? normalizeNode(n.root, n.details) : normalizeNode(n); });
        } else if (g.root){

        var ni = nets.length;

  }

  function collectAllNames(){
    var set = {};
    function add(n){ if (n) set[n] = true; }
    D.tiers.forEach(function(t){ t.people.forEach(function(p){ add(p.name); }); });
    D.ministries.forEach(function(m){ add(m.head); });
    D.assistants.forEach(function(a){ add(a.name); });
    D.cma.forEach(function(g){ g.people.forEach(add); });
    D.admin.forEach(function(g){ add(g.head); g.people.forEach(add); });
    function walk(node){ add(node.name); (node.children||[]).forEach(walk); }
    D.dgroups.forEach(function(g){ g.networks.forEach(walk); });
    return Object.keys(set);
  }
  function collectRoles(name){
    var roles = [];
    if (!name) return roles;
    D.tiers.forEach(function(t){
      t.people.forEach(function(p){
        if (p.name === name) roles.push({icon:"ic-crown", tone:t.accent, title:t.rank, sub:t.tag, photo:p.photo});
      });
    });
    D.ministries.forEach(function(m){
      if (m.head === name) roles.push({icon:m.icon, tone:m.tone, title:"Ministry Head", sub:m.name});
    });
    D.assistants.forEach(function(a){
      if (a.name === name) roles.push({icon:"ic-hands", tone:a.tone, title:"Assistant Head", sub:a.sub});
    });
    D.cma.forEach(function(g){
      if (g.people.indexOf(name) !== -1) roles.push({icon:g.icon, tone:g.tone, title:"Worker · Volunteer", sub:g.title});
    });
    D.admin.forEach(function(g){
      if (g.head === name) roles.push({icon:g.icon, tone:g.tone, title:"Ministry Head", sub:g.title});
      if (g.people.indexOf(name) !== -1) roles.push({icon:g.icon, tone:g.tone, title:"Worker", sub:g.title});
    });
    D.dgroups.forEach(function(g){
      function walk(node){
        if (node.name === name) roles.push({icon:"ic-people", tone:"", title:node.role, sub:g.group,
          photo:node.photo, desc:node.desc, timing:node.timing, location:node.location});
        (node.children||[]).forEach(walk);
      }
      g.networks.forEach(walk);
    });
    return roles;
  }

  /* ---------- neon border (traveling comet-light around the countdown card) ---------- */
  var NB_GLOW_LAYERS = [

  function nbWithAlpha(hex, alpha){
    var a = Math.max(0, Math.min(1, alpha));
    var n = parseInt(String(hex).replace("#",""), 16);
    if (!isFinite(n)) return "rgba(0,0,0,"+a+")";
    return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
  }
  function nbPerimeterPoint(u, w, h){
    var d = (((u % 1) + 1) % 1) * 2 * (w + h);
    if (d < w) return [d, 0];
    if (d < w + h) return [w, d - w];
    if (d < w*2 + h) return [w - (d - w - h), h];
    return [0, h - (d - w*2 - h)];
  }
  function nbCornerLap(k, w, h){
    var p = 2 * (w + h);
    var at = [0, w/p, (w+h)/p, (w*2+h)/p];
    return Math.floor(k/4) + at[((k % 4) + 4) % 4];
  }
  function nbPerimeterAngle(u, w, h){
    var pt = nbPerimeterPoint(u, w, h);
    return Math.atan2(pt[0] - w/2, h/2 - pt[1]) * 180 / Math.PI;
  }
  function nbBuildArc(lap, lengthPct, w, h, color){
    var fw = w > 0 ? w : 100, fh = h > 0 ? h : 100;
    var len = Math.max(0, Math.min(100, lengthPct));
    var span = Math.max(NB_MIN_ARC, (len/100) * .5);
    var solidT = len / 100;
    var stops = [], base = 0, prev = 0, acc = 0;
    for (var i = 0; i <= NB_ARC_SAMPLES; i++){
      var f = i / NB_ARC_SAMPLES;
      var angle = nbPerimeterAngle(lap + (f - .5) * span, fw, fh);
      if (i === 0){ base = angle; }
      else {
        var d = angle - prev;
        while (d > 180) d -= 360;
        while (d < -180) d += 360;
        acc += d;
      }
      prev = angle;
      var t = Math.abs(f - .5) * 2;
      var k = solidT >= 1 ? 1 : (t <= solidT ? 1 : 1 - (t - solidT) / (1 - solidT));
      stops.push(nbWithAlpha(color, k*k*(3-2*k)) + " " + acc.toFixed(2) + "deg");
    }
    stops.push(nbWithAlpha(color, 0) + " " + acc.toFixed(2) + "deg");
    stops.push(nbWithAlpha(color, 0) + " 360deg");

  function nbMakeEaseFn(pts){
    var x1=pts[0], y1=pts[1], x2=pts[2], y2=pts[3];
    if (x1 === y1 && x2 === y2) return function(t){ return t; };
    function bez(a,b,t){ var u = 1-t; return 3*u*u*t*a + 3*u*t*t*b + t*t*t; }
    return function(t){
      var x = Math.max(0, Math.min(1, t)), s = x;
      for (var i = 0; i < 8; i++){
        var cx = bez(x1,x2,s) - x;
        var u = 1 - s;
        var dx = 3*u*u*x1 + 6*u*s*(x2-x1) + 3*s*s*(1-x2);
        if (Math.abs(dx) < 1e-6) break;
        s -= cx/dx;
        s = Math.max(0, Math.min(1, s));
      }
      return bez(y1,y2,s);
    };

  var nbGlideEase = nbMakeEaseFn([.65,0,.35,1]);

  function nbApplyStyle(el, obj){ for (var k in obj) el.style[k] = obj[k]; }

  }
  function nbBuildGroup(container, radius, glowOuter, thick, amount, ringAt){

      var edge = document.createElement("div");

  function initNeonBorder(target, opts){
    opts = opts || {};

    var roundedPct = opts.rounded != null ? opts.rounded : 22;
    var thick = Math.max(1, Math.min(10, opts.thickness != null ? opts.thickness : 2));
    var borderSize = opts.borderSize != null ? opts.borderSize : 30;
    var glowPct = Math.max(0, Math.min(100, opts.glow != null ? opts.glow : 65));

    nbApplyStyle(groupA, { position:"absolute", inset:"0", overflow:"visible", pointerEvents:"none" });
    nbApplyStyle(groupB, { position:"absolute", inset:"0", overflow:"visible", pointerEvents:"none" });
    wrap.appendChild(groupA); wrap.appendChild(groupB);
    target.appendChild(wrap);

    var size = {w:0,h:0}, radius = 0, glowOuter = 0;
    function rebuild(){
      var r = target.getBoundingClientRect();
      size.w = r.width; size.h = r.height;
      radius = (Math.max(0, Math.min(100, roundedPct)) / 100) * (Math.min(size.w, size.h) / 2);
      glowOuter = 10 + NB_MAX_GLOW_REACH + NB_MAX_GLOW_BLUR * 2;
      nbBuildGroup(groupA, radius, glowOuter, thick, amount, ringAt);
      nbBuildGroup(groupB, radius, glowOuter, thick, amount, ringAt);
      groupA.style.setProperty("--nb-arc", nbBuildArc(lap, borderSize, size.w, size.h, color));
      groupB.style.setProperty("--nb-arc", nbBuildArc(lap+0.5, borderSize, size.w, size.h, color));

        var beat = step
